name: YouTube Polyglot Video Publish

on:
  workflow_call:
    inputs:
      mode: { required: true, type: string }
      set_id: { required: true, type: string }
      support: { required: true, type: string }
      bundle: { required: true, type: string }
      limit: { required: false, type: string, default: "0" }
      content_scope: { required: false, type: string, default: "full" }
      max_duration_seconds: { required: false, type: string, default: "895" }
      privacy: { required: false, type: string, default: "private" }
      publish_mode: { required: false, type: string, default: "scheduled" }
      publish_at: { required: false, type: string, default: "" }
      schedule_start_date: { required: false, type: string, default: "" }
      schedule_min_future_minutes: { required: false, type: string, default: "90" }
      create_playlists: { required: false, type: boolean, default: true }
      allow_republish: { required: false, type: boolean, default: false }
      generate_thumbnails: { required: false, type: boolean, default: false }
      confirm_thumbnail_spend: { required: false, type: string, default: "" }
      confirm_render: { required: false, type: string, default: "" }
      confirm_tts: { required: false, type: string, default: "" }
      confirm_metadata_spend: { required: false, type: string, default: "" }
      confirm_openai_metadata: { required: false, type: string, default: "" }
      confirm_vectorengine_metadata: { required: false, type: string, default: "" }
      confirm_youtube_write: { required: false, type: string, default: "" }
      confirm_public: { required: false, type: string, default: "" }
      campaign_id: { required: false, type: string, default: "" }
      campaign_manifest_hash: { required: false, type: string, default: "" }
      campaign_metadata_route: { required: false, type: string, default: "" }
      campaign_owned_apply: { required: true, type: boolean }
      offline_deck_git_commit: { required: false, type: string, default: "" }
      offline_deck_sha256: { required: false, type: string, default: "" }
  workflow_dispatch:
    inputs:
      mode:
        description: "plan validates only; render_no_audio renders a preview; render_audio renders audio; apply uploads after confirms."
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - render_no_audio
          - render_audio
          - apply
      set_id:
        description: "Set ID of the deck to plan/render."
        required: true
        default: "home_kitchen_cookware_pilot_01"
      support:
        description: "One support/viewer language code. Polyglot creates one video per support language."
        required: true
        default: "RU"
      bundle:
        description: "Polyglot starter bundle key from config/polyglot-video-bundles.json."
        required: true
        default: "global_europe_core"
        type: choice
        options:
          - global_europe_core
          - romance_core
          - east_asia_core
          - slavic_core
          - southeast_asia_core
          - germanic_core
          - nordic_core
          - balkan_slavic_core
          - south_asia_indo_aryan_core
          - south_asia_dravidian_core
          - turkic_core
          - caucasus_bridge_core
          - baltic_core
      limit:
        description: "Card limit. Use 0 for full deck; short_unverified apply uses a positive limit."
        required: true
        default: "3"
      content_scope:
        description: "full uses normal Polyglot rules; short_unverified allows <=15 minute videos for unverified channels."
        required: true
        default: "full"
        type: choice
        options:
          - full
          - short_unverified
      max_duration_seconds:
        description: "Hard duration gate for short_unverified uploads. 895 = 14:55."
        required: true
        default: "895"
      allow_republish:
        description: "Allow planning/rendering a Polyglot key already active in registry/calendar."
        required: true
        default: false
        type: boolean
      confirm_render:
        description: "For render_no_audio/render_audio/apply type RENDER_POLYGLOT_VIDEO."
        required: false
        default: ""
      confirm_tts:
        description: "For render_audio/apply type GENERATE_TTS_AUDIO."
        required: false
        default: ""
      privacy:
        description: "Initial YouTube privacy. Ignored for publish_mode=scheduled, which uploads private until publishAt."
        required: true
        default: "public"
        type: choice
        options:
          - public
          - unlisted
          - private
      publish_mode:
        description: "public_now publishes immediately; scheduled reserves the earliest free shared channel-calendar slot."
        required: true
        default: "scheduled"
        type: choice
        options:
          - scheduled
          - public_now
      schedule_start_date:
        description: "Optional YYYY-MM-DD hint. A later date cannot leave earlier policy slots empty."
        required: false
        default: ""
      schedule_min_future_minutes:
        description: "Minimum lead time for a newly reserved scheduled slot."
        required: true
        default: "90"
      publish_at:
        description: "Deprecated for apply. Use publish_mode=scheduled and the shared calendar."
        required: false
        default: ""
      create_playlists:
        description: "Create missing Polyglot playlist during apply."
        required: true
        default: true
        type: boolean
      generate_thumbnails:
        description: "Deprecated: Polyglot apply uses committed approved JPG covers; keep false."
        required: true
        default: false
        type: boolean
      confirm_metadata_spend:
        description: "For apply AI metadata generation type GENERATE_POLYGLOT_METADATA."
        required: false
        default: ""
      confirm_openai_metadata:
        description: "USE_OPENAI_METADATA permits OpenAI Responses metadata generation."
        required: false
        default: ""
      confirm_vectorengine_metadata:
        description: "USE_VECTORENGINE_METADATA permits VectorEngine only after both direct Gemini keys fail."
        required: false
        default: ""
      confirm_thumbnail_spend:
        description: "For VectorEngine image thumbnails type GENERATE_THUMBNAILS."
        required: false
        default: ""
      confirm_youtube_write:
        description: "For apply type APPLY_POLYGLOT_YOUTUBE_UPLOAD."
        required: false
        default: ""
      confirm_public:
        description: "For public videos type PUBLISH_PUBLIC."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: youtube-publish-channel-${{ inputs.support }}-${{ inputs.mode == 'apply' && 'apply' || github.run_id }}
  cancel-in-progress: false

jobs:
  youtube-polyglot-video:
    runs-on: ubuntu-latest
    environment: >-
      ${{
        (contains('|EN|EN-GB|ES|ES-419|PT|PT-BR|RU|HI|ID|FR|DE|JA|KO|TR|ZH|en|en-gb|es|es-419|pt|pt-br|ru|hi|id|fr|de|ja|ko|tr|zh|', format('|{0}|', inputs.support)) && 'youtube-api-branding') ||
        (contains('|VI|TH|MS|PL|NL|SV|NO|DA|FI|CS|SK|HU|RO|vi|th|ms|pl|nl|sv|no|da|fi|cs|sk|hu|ro|', format('|{0}|', inputs.support)) && 'youtube-api-youtube-2') ||
        (contains('|BG|HR|SR|SL|LT|LV|ET|IS|BN|TL|MY|KM|LO|bg|hr|sr|sl|lt|lv|et|is|bn|tl|my|km|lo|', format('|{0}|', inputs.support)) && 'youtube-api-youtube-3') ||
        (contains('|NE|SI|TA|TE|KN|ML|UZ|KK|AZ|KA|HY|SW|IT|ne|si|ta|te|kn|ml|uz|kk|az|ka|hy|sw|it|', format('|{0}|', inputs.support)) && 'youtube-api-youtube-4') ||
        'youtube-api-branding'
      }}
    timeout-minutes: 240

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify required Polyglot workflow helpers
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/check-youtube-polyglot-state.mjs
          test -f scripts/check-polyglot-video-duration.mjs

      - name: Refuse unsafe Polyglot inputs
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          SUPPORT: ${{ inputs.support }}
          LIMIT: ${{ steps.polyglot_plan.outputs.effective_card_limit || inputs.limit }}
          CONTENT_SCOPE: ${{ inputs.content_scope }}
          MAX_DURATION_SECONDS: ${{ inputs.max_duration_seconds }}
          PRIVACY: ${{ inputs.privacy }}
          PUBLISH_MODE: ${{ inputs.publish_mode }}
          SCHEDULE_START_DATE: ${{ inputs.schedule_start_date }}
          SCHEDULE_MIN_FUTURE_MINUTES: ${{ inputs.schedule_min_future_minutes }}
          PUBLISH_AT: ${{ inputs.publish_at }}
          GENERATE_THUMBNAILS: ${{ inputs.generate_thumbnails }}
          CONFIRM_RENDER: ${{ inputs.confirm_render }}
          CONFIRM_TTS: ${{ inputs.confirm_tts }}
          CONFIRM_METADATA_SPEND: ${{ inputs.confirm_metadata_spend }}
          CONFIRM_OPENAI_METADATA: ${{ inputs.confirm_openai_metadata }}
          CONFIRM_VECTORENGINE_METADATA: ${{ inputs.confirm_vectorengine_metadata }}
          CONFIRM_THUMBNAIL_SPEND: ${{ inputs.confirm_thumbnail_spend }}
          CONFIRM_YOUTUBE_WRITE: ${{ inputs.confirm_youtube_write }}
          CONFIRM_PUBLIC: ${{ inputs.confirm_public }}
          CAMPAIGN_ID: ${{ inputs.campaign_id }}
          CAMPAIGN_MANIFEST_HASH: ${{ inputs.campaign_manifest_hash }}
          CAMPAIGN_METADATA_ROUTE: ${{ inputs.campaign_metadata_route }}
          CAMPAIGN_OWNED_APPLY: ${{ inputs.campaign_owned_apply }}
        run: |
          set -euo pipefail
          support_clean="$(printf '%s' "$SUPPORT" | tr '[:lower:]' '[:upper:]' | xargs)"
          if [ "$support_clean" = "ALL" ] || printf '%s' "$support_clean" | grep -q ','; then
            echo "::error::Polyglot workflow accepts exactly one explicit support language."
            exit 1
          fi
          if [ "$MODE" = "apply" ] && [ "$SUPPORT" != "$support_clean" ]; then
            echo "::error::mode=apply requires a trimmed uppercase canonical support code so the concurrency lock cannot be bypassed."
            exit 1
          fi
          if [ "$MODE" = "apply" ] && { [ "$support_clean" = "EN-GB" ] || [ "$support_clean" = "ES" ] || [ "$support_clean" = "PT" ]; }; then
            echo "::error::EN-GB, ES and PT are target-only variants. Use canonical support EN, ES-419 or PT-BR."
            exit 1
          fi
          if { [ -n "$CAMPAIGN_ID" ] && [ -z "$CAMPAIGN_MANIFEST_HASH" ]; } || { [ -z "$CAMPAIGN_ID" ] && [ -n "$CAMPAIGN_MANIFEST_HASH" ]; }; then
            echo "::error::campaign_id and campaign_manifest_hash must be supplied together."
            exit 1
          fi
          if [ -n "$CAMPAIGN_ID" ] && [ -z "$CAMPAIGN_METADATA_ROUTE" ]; then
            echo "::error::campaign-owned calls require campaign_metadata_route."
            exit 1
          fi
          if [ "$MODE" = "apply" ] && [ "$CAMPAIGN_OWNED_APPLY" != "true" ]; then
            echo "::error::Direct apply is disabled. Use youtube-publication-campaign.yml with an already-claimed campaign."
            exit 1
          fi
          if ! printf '%s' "$LIMIT" | grep -Eq '^[0-9]+$'; then
            echo "::error::limit must be an integer."
            exit 1
          fi
          if [ "$CONTENT_SCOPE" != "full" ] && [ "$CONTENT_SCOPE" != "short_unverified" ]; then
            echo "::error::content_scope must be full or short_unverified."
            exit 1
          fi
          if ! printf '%s' "$MAX_DURATION_SECONDS" | grep -Eq '^[0-9]+$'; then
            echo "::error::max_duration_seconds must be an integer."
            exit 1
          fi
          if [ "$MODE" != "plan" ] && [ "$CONFIRM_RENDER" != "RENDER_POLYGLOT_VIDEO" ]; then
            echo "::error::render modes require confirm_render=RENDER_POLYGLOT_VIDEO"
            exit 1
          fi
          if { [ "$MODE" = "render_audio" ] || [ "$MODE" = "apply" ]; } && [ "$CONFIRM_TTS" != "GENERATE_TTS_AUDIO" ]; then
            echo "::error::render_audio may spend TTS/provider usage and requires confirm_tts=GENERATE_TTS_AUDIO"
            exit 1
          fi
          if [ "$MODE" = "apply" ] && [ "$LIMIT" != "0" ] && [ "$CONTENT_SCOPE" != "short_unverified" ]; then
            echo "::error::mode=apply with limit != 0 is only allowed for content_scope=short_unverified."
            exit 1
          fi
          if [ "$CONTENT_SCOPE" = "short_unverified" ] && ! printf '%s' "$LIMIT" | grep -Eq '^[0-9]+$'; then
            echo "::error::content_scope=short_unverified requires a non-negative integer card limit; 0 selects the measured full-deck prefix."
            exit 1
          fi
          if [ "$CONTENT_SCOPE" = "short_unverified" ] && [ "$MAX_DURATION_SECONDS" -gt 895 ]; then
            echo "::error::short_unverified max_duration_seconds must stay <=895 (14:55) to avoid YouTube's 15-minute unverified limit."
            exit 1
          fi
          if [ "$MODE" = "apply" ] && [ "$CONFIRM_METADATA_SPEND" != "GENERATE_POLYGLOT_METADATA" ]; then
            echo "::error::mode=apply requires confirm_metadata_spend=GENERATE_POLYGLOT_METADATA"
            exit 1
          fi
          if [ -n "$CONFIRM_OPENAI_METADATA" ] && [ "$CONFIRM_OPENAI_METADATA" != "USE_OPENAI_METADATA" ]; then
            echo "::error::confirm_openai_metadata must be empty or USE_OPENAI_METADATA"
            exit 1
          fi
          if [ -n "$CONFIRM_VECTORENGINE_METADATA" ] && [ "$CONFIRM_VECTORENGINE_METADATA" != "USE_VECTORENGINE_METADATA" ]; then
            echo "::error::confirm_vectorengine_metadata must be empty or USE_VECTORENGINE_METADATA"
            exit 1
          fi
          if [ "$MODE" = "apply" ] && [ "$CONFIRM_YOUTUBE_WRITE" != "APPLY_POLYGLOT_YOUTUBE_UPLOAD" ]; then
            echo "::error::mode=apply requires confirm_youtube_write=APPLY_POLYGLOT_YOUTUBE_UPLOAD"
            exit 1
          fi
          if [ "$MODE" = "apply" ] && [ "${{ inputs.allow_republish }}" = "true" ]; then
            echo "::error::allow_republish is disabled for apply. Repair, supersede or delete the prior publication first."
            exit 1
          fi
          if [ "$MODE" = "apply" ] && [ "$GENERATE_THUMBNAILS" = "true" ]; then
            echo "::error::Polyglot apply uses committed approved JPG covers; set generate_thumbnails=false. VectorEngine thumbnails are disabled."
            exit 1
          fi
          if [ "$PUBLISH_MODE" != "scheduled" ] && [ "$PUBLISH_MODE" != "public_now" ]; then
            echo "::error::publish_mode must be scheduled or public_now"
            exit 1
          fi
          if [ -n "$SCHEDULE_START_DATE" ] && ! printf '%s' "$SCHEDULE_START_DATE" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "::error::schedule_start_date must be YYYY-MM-DD"
            exit 1
          fi
          if ! printf '%s' "$SCHEDULE_MIN_FUTURE_MINUTES" | grep -Eq '^[0-9]+$'; then
            echo "::error::schedule_min_future_minutes must be a non-negative integer"
            exit 1
          fi
          if [ "$MODE" = "apply" ] && [ -n "$PUBLISH_AT" ]; then
            echo "::error::direct publish_at is disabled for apply; use publish_mode=scheduled so the shared calendar selects the slot"
            exit 1
          fi
          if [ "$PUBLISH_MODE" = "scheduled" ] && [ "$CONFIRM_PUBLIC" != "PUBLISH_PUBLIC" ] && [ "$MODE" = "apply" ]; then
            echo "::error::scheduled uploads become public and require confirm_public=PUBLISH_PUBLIC"
            exit 1
          fi
          if [ "$PUBLISH_MODE" = "public_now" ] && [ "$PRIVACY" = "public" ] && [ "$CONFIRM_PUBLIC" != "PUBLISH_PUBLIC" ] && [ "$MODE" = "apply" ]; then
            echo "::error::privacy=public requires confirm_public=PUBLISH_PUBLIC"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Node dependencies
        run: npm ci || npm install

      - name: Download route-batched campaign metadata
        if: ${{ inputs.campaign_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: youtube-campaign-metadata-${{ inputs.campaign_id }}-${{ inputs.campaign_metadata_route }}
          path: .campaign-metadata

      - name: Restore YouTube OAuth bundle from environment secret
        if: ${{ inputs.mode == 'apply' }}
        env:
          YOUTUBE_OAUTH_BUNDLE_TGZ_B64: ${{ secrets.YOUTUBE_OAUTH_BUNDLE_TGZ_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${YOUTUBE_OAUTH_BUNDLE_TGZ_B64:-}" ]; then
            echo "::error::Missing environment secret YOUTUBE_OAUTH_BUNDLE_TGZ_B64"
            exit 1
          fi
          printf '%s' "$YOUTUBE_OAUTH_BUNDLE_TGZ_B64" | base64 -d | tar -xzf -
          test -f .local/youtube-oauth/google-oauth-client.json
          test -d .local/youtube-oauth/tokens

      - name: Download offline deck data from Google Drive
        shell: bash
        env:
          HISTORICAL_DECK_COMMIT: ${{ inputs.offline_deck_git_commit }}
          EXPECTED_DECK_SHA256: ${{ inputs.offline_deck_sha256 }}
        run: |
          set -euo pipefail
          SET_ID="${{ inputs.set_id }}"
          FILE_ID=$(node -e "
            const fs = require('fs');
            const path = require('path');
            const mappingPath = path.resolve('data/deck-sources.json');
            if (fs.existsSync(mappingPath)) {
              const mapping = JSON.parse(fs.readFileSync(mappingPath, 'utf8'));
              console.log(mapping['$SET_ID'] || '');
            }
          ")
          if [ -n "$FILE_ID" ] && [ "$FILE_ID" != "YOUR_GOOGLE_DRIVE_FILE_ID_HERE" ]; then
            echo "Found Google Drive File ID for $SET_ID."
            mkdir -p data/decks
            curl -c /tmp/cookies -sL "https://docs.google.com/uc?export=download&id=${FILE_ID}" > /tmp/confirm.html
            CONFIRM=$(grep -o 'confirm=[^&\" ]*' /tmp/confirm.html | head -n1 | cut -d= -f2 || true)
            if [ -n "$CONFIRM" ]; then
              curl -Lb /tmp/cookies "https://docs.google.com/uc?export=download&confirm=${CONFIRM}&id=${FILE_ID}" -o "data/decks/${SET_ID}.json"
            else
              curl -Lb /tmp/cookies "https://docs.google.com/uc?export=download&id=${FILE_ID}" -o "data/decks/${SET_ID}.json"
            fi
            echo "Downloaded offline data to data/decks/${SET_ID}.json"
          else
            echo "No Google Drive File ID found for $SET_ID in data/deck-sources.json."
          fi

          if [ ! -s "data/decks/${SET_ID}.json" ] && [ -n "$HISTORICAL_DECK_COMMIT" ]; then
            echo "Restoring offline deck from historical commit $HISTORICAL_DECK_COMMIT"
            mkdir -p data/decks
            git show "${HISTORICAL_DECK_COMMIT}:data/decks/${SET_ID}.json" > "data/decks/${SET_ID}.json"
          fi

          if [ -s "data/decks/${SET_ID}.json" ] && [ -n "$EXPECTED_DECK_SHA256" ]; then
            ACTUAL_DECK_SHA256="$(sha256sum "data/decks/${SET_ID}.json" | cut -d' ' -f1)"
            if [ "$ACTUAL_DECK_SHA256" != "$EXPECTED_DECK_SHA256" ]; then
              echo "::error::Offline deck checksum mismatch for $SET_ID"
              exit 1
            fi
          fi

      - name: Plan Polyglot candidate
        id: polyglot_plan
        shell: bash
        env:
          SET_ID: ${{ inputs.set_id }}
          SUPPORT: ${{ inputs.support }}
          BUNDLE: ${{ inputs.bundle }}
          LIMIT: ${{ inputs.limit }}
          CONTENT_SCOPE: ${{ inputs.content_scope }}
          MAX_DURATION_SECONDS: ${{ inputs.max_duration_seconds }}
          ALLOW_REPUBLISH: ${{ inputs.allow_republish }}
          CAMPAIGN_ID: ${{ inputs.campaign_id }}
          CAMPAIGN_MANIFEST_HASH: ${{ inputs.campaign_manifest_hash }}
        run: |
          set -euo pipefail
          PLAN_ARGS=("--set" "$SET_ID" "--support" "$SUPPORT" "--bundle" "$BUNDLE" "--content-scope" "$CONTENT_SCOPE" "--max-duration-seconds" "$MAX_DURATION_SECONDS" "--card-limit" "$LIMIT" "--require-offline-deck" "--output=outputs/video-generator/youtube-polyglot-plan-github.json")
          if [ -n "$CAMPAIGN_ID" ]; then
            PLAN_ARGS+=("--campaign-id" "$CAMPAIGN_ID" "--campaign-manifest-hash" "$CAMPAIGN_MANIFEST_HASH")
          fi
          if [ "$ALLOW_REPUBLISH" = "true" ]; then
            PLAN_ARGS+=("--allow-republish")
          fi
          npm run plan:youtube-polyglot -- "${PLAN_ARGS[@]}"
          node -e '
            const fs = require("fs");
            const report = JSON.parse(fs.readFileSync("outputs/video-generator/youtube-polyglot-plan-github.json", "utf8"));
            const c = report.candidate || {};
            const s = report.summary || {};
            const effectiveScope = s.contentScope || c.contentScope || "";
            const effectiveMax = String(s.maxDurationSeconds || "");
            const effectiveCardLimit = String(s.cardLimit ?? c.cardLimit ?? "0");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `target_langs=${c.targetLangsCsv || ""}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `polyglot_key=${c.polyglotKey || ""}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `effective_content_scope=${effectiveScope}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `effective_max_duration=${effectiveMax}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `effective_card_limit=${effectiveCardLimit}\n`);
            const alreadyPublished = (c.existingPublication || (c.existingProgressItem && c.existingProgressItem.youtubeVideoId)) ? "true" : "false";
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `already_published=${alreadyPublished}\n`);
            if (process.env.GITHUB_STEP_SUMMARY) {
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
                "### Polyglot plan",
                "",
                c.autoFallbackContentScope ? `**Auto-fallback**: content_scope=${effectiveScope} card_limit=${effectiveCardLimit} max_duration=${effectiveMax}s (long-video upload not confirmed)` : "",
                `- Polyglot key: ${c.polyglotKey || ""}`,
                `- Support: ${c.supportLang || ""}`,
                `- Bundle: ${c.bundleKey || ""}`,
                `- Content scope: ${effectiveScope}`,
                `- Targets: ${c.targetLangsCsv || ""}`,
                `- Cards: ${c.deck?.cardCount || 0}`,
                `- Study URL: ${c.studyUrl || ""}`,
                `- Already published: ${alreadyPublished}`,
                "",
              ].join("\n"));
            }
          '

      - name: Audit and gate live Polyglot publication state
        if: ${{ inputs.mode == 'apply' && steps.polyglot_plan.outputs.already_published != 'true' }}
        shell: bash
        env:
          SET_ID: ${{ inputs.set_id }}
          SUPPORT: ${{ inputs.support }}
          TARGET_LANGS: ${{ steps.polyglot_plan.outputs.target_langs }}
          POLYGLOT_KEY: ${{ steps.polyglot_plan.outputs.polyglot_key }}
        run: |
          set -euo pipefail
          npm run audit:youtube-live-publications -- --set "$SET_ID" --support "$SUPPORT" --include-video-status --output=outputs/youtube-live-publications-github.json --json
          CONTROL_ARGS=("--set=$SET_ID" "--support=$SUPPORT" "--video-types=polyglot" "--targets=$TARGET_LANGS" "--proposed-polyglot-key=$POLYGLOT_KEY" "--live-audit=outputs/youtube-live-publications-github.json" "--output=outputs/youtube-publication-control-github.json" "--strict")
          npm run check:youtube-publication-control -- "${CONTROL_ARGS[@]}"

      - name: Preflight scheduled public playlist before metadata and render
        if: ${{ inputs.mode == 'apply' && inputs.publish_mode == 'scheduled' && steps.polyglot_plan.outputs.already_published != 'true' }}
        shell: bash
        env:
          SUPPORT: ${{ inputs.support }}
        run: |
          set -euo pipefail
          ROUTE_KEY="$(node --input-type=module -e '
            import { canonicalSupportRouteKey, loadCanonicalSupportRouting } from "./scripts/lib/youtube-support-routing.mjs";
            const route = canonicalSupportRouteKey(loadCanonicalSupportRouting(), process.env.SUPPORT);
            if (!route) throw new Error(`Missing route for ${process.env.SUPPORT}`);
            process.stdout.write(route);
          ')"
          npm run audit:youtube-playlists -- \
            --support="$SUPPORT" \
            --route-key="$ROUTE_KEY" \
            --output=outputs/youtube-polyglot-playlist-discovery-github.json
          npm run check:youtube-scheduled-playlist-visibility -- \
            --plan=outputs/video-generator/youtube-polyglot-plan-github.json \
            --discovery=outputs/youtube-polyglot-playlist-discovery-github.json \
            --require-public \
            --output=outputs/youtube-polyglot-playlist-visibility-github.json

      - name: Generate Polyglot YouTube metadata
        if: ${{ steps.polyglot_plan.outputs.already_published != 'true' }}
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          SET_ID: ${{ inputs.set_id }}
          SUPPORT: ${{ inputs.support }}
          BUNDLE: ${{ inputs.bundle }}
          LIMIT: ${{ steps.polyglot_plan.outputs.effective_card_limit || inputs.limit }}
          CONTENT_SCOPE: ${{ steps.polyglot_plan.outputs.effective_content_scope || inputs.content_scope }}
          MAX_DURATION_SECONDS: ${{ steps.polyglot_plan.outputs.effective_max_duration || inputs.max_duration_seconds }}
          PRIVACY: ${{ inputs.privacy }}
          PUBLISH_MODE: ${{ inputs.publish_mode }}
          PUBLISH_AT: ${{ inputs.publish_at }}
          ALLOW_REPUBLISH: ${{ inputs.allow_republish }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_BACKEND: "openai,api,vectorengine"
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_METADATA_MODEL: ${{ vars.OPENAI_METADATA_MODEL }}
          OPENAI_SERVICE_TIER: ${{ vars.OPENAI_SERVICE_TIER }}
          OPENAI_TIMEOUT_MS: "600000"
          VECTORENGINE_API_KEY: ${{ secrets.VECTORENGINE_API_KEY }}
          VECTOR_ENGINE_API_KEY: ${{ secrets.VECTOR_ENGINE_API_KEY }}
          VECTORENGINE_BASE_URL: ${{ vars.VECTORENGINE_BASE_URL }}
          VECTORENGINE_GEMINI_MODEL: ${{ vars.VECTORENGINE_GEMINI_MODEL }}
          VECTORENGINE_SEND_RESPONSE_SCHEMA: "1"
          GEMINI_TIMEOUT_MS: "600000"
          VECTORENGINE_TIMEOUT_MS: "600000"
          CONFIRM_OPENAI_METADATA: ${{ inputs.confirm_openai_metadata }}
          CONFIRM_VECTORENGINE_METADATA: ${{ inputs.confirm_vectorengine_metadata }}
          CAMPAIGN_ID: ${{ inputs.campaign_id }}
          CAMPAIGN_MANIFEST_HASH: ${{ inputs.campaign_manifest_hash }}
        run: |
          set -euo pipefail
          if [ -n "$CAMPAIGN_ID" ]; then
            npm run copy:youtube-campaign-metadata -- \
              --campaign-id="$CAMPAIGN_ID" \
              --manifest-hash="$CAMPAIGN_MANIFEST_HASH" \
              --video-type=polyglot \
              --support="$SUPPORT" \
              --input-root=.campaign-metadata \
              --output=outputs/polyglot-campaign-metadata-copy-github.json
            exit 0
          fi
          EFFECTIVE_PRIVACY="$PRIVACY"
          if [ "$PUBLISH_MODE" = "scheduled" ]; then
            EFFECTIVE_PRIVACY="private"
          fi
          METADATA_ARGS=("--set" "$SET_ID" "--support" "$SUPPORT" "--bundle" "$BUNDLE" "--content-scope" "$CONTENT_SCOPE" "--max-duration-seconds" "$MAX_DURATION_SECONDS" "--privacy" "$EFFECTIVE_PRIVACY")
          if [ "$LIMIT" != "0" ]; then
            METADATA_ARGS+=("--word-limit" "$LIMIT")
          fi
          if [ -n "$PUBLISH_AT" ]; then
            METADATA_ARGS+=("--publish-at" "$PUBLISH_AT")
          fi
          if [ "$ALLOW_REPUBLISH" = "true" ]; then
            METADATA_ARGS+=("--allow-republish")
          fi
          if [ -n "$CAMPAIGN_ID" ]; then
            METADATA_ARGS+=("--campaign-id" "$CAMPAIGN_ID" "--campaign-manifest-hash" "$CAMPAIGN_MANIFEST_HASH")
          fi
          if [ "$MODE" = "apply" ]; then
            METADATA_ARGS+=("--with-gemini" "--require-ai")
          fi
          METADATA_CHAIN="api"
          if [ "$CONFIRM_OPENAI_METADATA" = "USE_OPENAI_METADATA" ]; then
            METADATA_CHAIN="openai,$METADATA_CHAIN"
          fi
          if [ "$CONFIRM_VECTORENGINE_METADATA" = "USE_VECTORENGINE_METADATA" ]; then
            METADATA_CHAIN="$METADATA_CHAIN,vectorengine"
          fi
          METADATA_ARGS+=("--gemini-backend" "$METADATA_CHAIN")
          npm run generate:polyglot-youtube-metadata -- "${METADATA_ARGS[@]}"

      - name: Reserve earliest shared channel-calendar slot
        if: ${{ inputs.publish_mode == 'scheduled' && steps.polyglot_plan.outputs.already_published != 'true' }}
        shell: bash
        env:
          SCHEDULE_START_DATE: ${{ inputs.schedule_start_date }}
          SCHEDULE_MIN_FUTURE_MINUTES: ${{ inputs.schedule_min_future_minutes }}
          CAMPAIGN_ID: ${{ inputs.campaign_id }}
          CAMPAIGN_MANIFEST_HASH: ${{ inputs.campaign_manifest_hash }}
        run: |
          set -euo pipefail
          SCHEDULE_ARGS=(outputs/video-generator "--start-date=$SCHEDULE_START_DATE" "--policy=config/youtube-publish-schedule-policy.json" "--calendar=config/youtube-publish-calendar.json" "--publication-registry=config/youtube-published-videos.json" "--polyglot-publication-registry=config/youtube-polyglot-published-videos.json" --write-metadata --write-calendar --reschedule-past-reservations --fill-earliest "--min-future-minutes=$SCHEDULE_MIN_FUTURE_MINUTES" "--output=outputs/youtube-polyglot-publish-schedule-github.json")
          if [ -n "$CAMPAIGN_ID" ]; then
            SCHEDULE_ARGS+=("--campaign-id=$CAMPAIGN_ID" "--campaign-manifest-hash=$CAMPAIGN_MANIFEST_HASH")
          fi
          npm run plan:youtube-publish-schedule -- "${SCHEDULE_ARGS[@]}"

      - name: Check Polyglot YouTube metadata
        if: ${{ steps.polyglot_plan.outputs.already_published != 'true' }}
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          SUPPORT: ${{ inputs.support }}
          BUNDLE: ${{ inputs.bundle }}
          TARGET_LANGS: ${{ steps.polyglot_plan.outputs.target_langs }}
        run: |
          set -euo pipefail
          CHECK_ARGS=("outputs/video-generator" "--expected-support=$SUPPORT" "--expected-bundle=$BUNDLE" "--expected-targets=$TARGET_LANGS" "--output=outputs/polyglot-youtube-metadata-check-github.json")
          if [ "$MODE" = "apply" ]; then
            CHECK_ARGS+=("--require-ai-metadata")
          fi
          npm run check:polyglot-youtube-metadata -- "${CHECK_ARGS[@]}"

      - name: Install render dependencies
        if: ${{ inputs.mode != 'plan' && steps.polyglot_plan.outputs.already_published != 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npx playwright install chromium --with-deps

      - name: Set up Python for audio render
        if: ${{ (inputs.mode == 'render_audio' || inputs.mode == 'apply') && steps.polyglot_plan.outputs.already_published != 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python TTS dependency
        if: ${{ (inputs.mode == 'render_audio' || inputs.mode == 'apply') && steps.polyglot_plan.outputs.already_published != 'true' }}
        run: pip install edge-tts

      - name: Render Polyglot video locally
        if: ${{ inputs.mode != 'plan' && steps.polyglot_plan.outputs.already_published != 'true' }}
        shell: bash
        env:
          AI33_API_KEY: ${{ secrets.AI33_API_KEY }}
          SET_ID: ${{ inputs.set_id }}
          SUPPORT: ${{ inputs.support }}
          TARGET_LANGS: ${{ steps.polyglot_plan.outputs.target_langs }}
          POLYGLOT_KEY: ${{ steps.polyglot_plan.outputs.polyglot_key }}
          LIMIT: ${{ steps.polyglot_plan.outputs.effective_card_limit || inputs.limit }}
          MODE: ${{ inputs.mode }}
          CONTENT_SCOPE: ${{ steps.polyglot_plan.outputs.effective_content_scope || inputs.content_scope }}
          MAX_DURATION_SECONDS: ${{ steps.polyglot_plan.outputs.effective_max_duration || inputs.max_duration_seconds }}
        run: |
          set -euo pipefail
          BUILD_ARGS=("--set" "$SET_ID" "--support" "$SUPPORT" "--targets" "$TARGET_LANGS" "--content-scope" "$CONTENT_SCOPE")
          if [ "$LIMIT" != "0" ]; then
            BUILD_ARGS+=("--limit" "$LIMIT")
          fi
          if [ "$CONTENT_SCOPE" = "short_unverified" ]; then
            BUILD_ARGS+=("--max-duration-seconds" "$MAX_DURATION_SECONDS")
          fi
          if [ "$MODE" = "render_no_audio" ]; then
            BUILD_ARGS+=("--no-audio")
          fi
          node scripts/build-polyglot-video.mjs "${BUILD_ARGS[@]}"

      - name: Check Polyglot duration and long-video capability
        if: ${{ inputs.mode != 'plan' && steps.polyglot_plan.outputs.already_published != 'true' }}
        shell: bash
        env:
          MAX_DURATION_SECONDS: ${{ steps.polyglot_plan.outputs.effective_max_duration || inputs.max_duration_seconds }}
          CONTENT_SCOPE: ${{ steps.polyglot_plan.outputs.effective_content_scope || inputs.content_scope }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          CHECK_ARGS=(outputs/video-generator "--content-scope" "$CONTENT_SCOPE" "--max-duration-seconds" "$MAX_DURATION_SECONDS" --write-metadata --output=outputs/polyglot-video-duration-check-github.json)
          if [ "$CONTENT_SCOPE" = "short_unverified" ] && [ "$MODE" != "render_no_audio" ]; then
            CHECK_ARGS+=(--require-measured-selection)
          fi
          npm run check:polyglot-video-duration -- "${CHECK_ARGS[@]}"

      - name: Copy approved pre-rendered Polyglot thumbnails
        if: ${{ inputs.mode == 'apply' && steps.polyglot_plan.outputs.already_published != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/copy-pre-rendered-thumbnails.mjs \
            --input-dir outputs/video-generator \
            --strict-custom \
            --require-git-tracked \
            --output=outputs/polyglot-pre-rendered-thumbnail-copy-github.json

      - name: Check Polyglot thumbnails or accepted fallback
        if: ${{ inputs.mode == 'apply' && steps.polyglot_plan.outputs.already_published != 'true' }}
        run: npm run check:youtube-thumbnails -- outputs/video-generator --allow-auto-first-frame --output=outputs/polyglot-youtube-thumbnail-check-github.json

      - name: Plan Polyglot YouTube upload
        if: ${{ steps.polyglot_plan.outputs.already_published != 'true' }}
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          CREATE_PLAYLISTS: ${{ inputs.create_playlists }}
          ALLOW_REPUBLISH: ${{ inputs.allow_republish }}
          CONTENT_SCOPE: ${{ steps.polyglot_plan.outputs.effective_content_scope || inputs.content_scope }}
          MAX_DURATION_SECONDS: ${{ steps.polyglot_plan.outputs.effective_max_duration || inputs.max_duration_seconds }}
        run: |
          set -euo pipefail
          UPLOAD_PLAN_ARGS=("outputs/video-generator" "--write-registry" "--allow-auto-thumbnail-fallback" "--output=outputs/youtube-polyglot-upload-plan-github.json")
          if [ "$CREATE_PLAYLISTS" = "true" ]; then
            UPLOAD_PLAN_ARGS+=("--allow-playlist-create")
          fi
          if [ "$ALLOW_REPUBLISH" = "true" ]; then
            UPLOAD_PLAN_ARGS+=("--allow-republish")
          fi
          if [ "$CONTENT_SCOPE" = "short_unverified" ]; then
            UPLOAD_PLAN_ARGS+=("--allow-short-unverified" "--max-duration-seconds" "$MAX_DURATION_SECONDS")
          fi
          if [ "$MODE" = "apply" ]; then
            UPLOAD_PLAN_ARGS+=("--require-ai-metadata")
          else
            UPLOAD_PLAN_ARGS+=("--allow-missing-video")
          fi
          npm run plan:youtube-polyglot-upload -- "${UPLOAD_PLAN_ARGS[@]}"

      - name: Gate Polyglot upload plan
        if: ${{ inputs.mode == 'apply' && steps.polyglot_plan.outputs.already_published != 'true' }}
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const report = JSON.parse(fs.readFileSync("outputs/youtube-polyglot-upload-plan-github.json", "utf8"));
            const s = report.summary || {};
            console.log(JSON.stringify(s, null, 2));
            if (!s.candidateCount) throw new Error("No Polyglot publish candidates.");
            if (s.blockerCount) throw new Error("Polyglot upload plan has blockers.");
            if (s.publishReadyCount !== s.candidateCount) throw new Error("Not all Polyglot candidates are publish_ready.");
          '

      - name: Refresh live Polyglot publication control immediately before upload
        if: ${{ inputs.mode == 'apply' && steps.polyglot_plan.outputs.already_published != 'true' }}
        shell: bash
        env:
          SET_ID: ${{ inputs.set_id }}
          SUPPORT: ${{ inputs.support }}
          TARGET_LANGS: ${{ steps.polyglot_plan.outputs.target_langs }}
          POLYGLOT_KEY: ${{ steps.polyglot_plan.outputs.polyglot_key }}
        run: |
          set -euo pipefail
          npm run audit:youtube-live-publications -- --set "$SET_ID" --support "$SUPPORT" --include-video-status --output=outputs/youtube-live-publications-github.json --json
          CONTROL_ARGS=("--set=$SET_ID" "--support=$SUPPORT" "--video-types=polyglot" "--targets=$TARGET_LANGS" "--proposed-polyglot-key=$POLYGLOT_KEY" "--live-audit=outputs/youtube-live-publications-github.json" "--output=outputs/youtube-publication-control-github.json" "--strict")
          npm run check:youtube-publication-control -- "${CONTROL_ARGS[@]}"

      - name: Upload Polyglot video to YouTube
        if: ${{ inputs.mode == 'apply' && steps.polyglot_plan.outputs.already_published != 'true' }}
        shell: bash
        env:
          CREATE_PLAYLISTS: ${{ inputs.create_playlists }}
          ALLOW_REPUBLISH: ${{ inputs.allow_republish }}
          INPUT_PRIVACY: ${{ inputs.privacy }}
          PUBLISH_MODE: ${{ inputs.publish_mode }}
          YOUTUBE_API_RETRY_ATTEMPTS: ${{ inputs.campaign_id != '' && '1' || '6' }}
        run: |
          set -euo pipefail
          mapfile -d '' METADATA_FILES < <(find outputs/video-generator -name youtube_metadata.json -print0 | sort -z)
          if [ "${#METADATA_FILES[@]}" -ne 1 ]; then
            echo "::error::Polyglot apply expects exactly one youtube_metadata.json, got ${#METADATA_FILES[@]}."
            exit 1
          fi
          PRIVACY="$INPUT_PRIVACY"
          if [ "$PUBLISH_MODE" = "scheduled" ]; then
            PRIVACY="private"
          fi
          PUBLISH_ARGS=(
            "--metadata=${METADATA_FILES[0]}"
            "--privacy=$PRIVACY"
            "--publication-control-report=outputs/youtube-publication-control-github.json"
            "--playlist-registry=config/youtube-polyglot-playlists.json"
            "--publication-registry=config/youtube-polyglot-published-videos.json"
            "--progress-registry=config/youtube-polyglot-progress.json"
            "--calendar=config/youtube-publish-calendar.json"
            "--ledger=outputs/youtube-polyglot-publish-ledger.jsonl"
            "--apply"
            "--confirm-youtube-write"
          )
          if [ "$CREATE_PLAYLISTS" = "true" ]; then
            PUBLISH_ARGS+=("--create-playlist")
          fi
          if [ "$ALLOW_REPUBLISH" = "true" ]; then
            PUBLISH_ARGS+=("--allow-republish")
          fi
          if [ "$PRIVACY" = "public" ]; then
            PUBLISH_ARGS+=("--confirm-public")
          fi
          npm run apply:youtube-publish -- "${PUBLISH_ARGS[@]}"

      - name: Upload Polyglot plan/render artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: youtube-polyglot-${{ inputs.set_id }}-${{ inputs.support }}-${{ inputs.bundle }}-${{ inputs.mode }}
          path: |
            outputs/video-generator/youtube-polyglot-plan-github.json
            outputs/youtube-polyglot-upload-plan-github.json
            outputs/polyglot-youtube-metadata-check-github.json
            outputs/polyglot-campaign-metadata-copy-github.json
            outputs/polyglot-video-duration-check-github.json
            outputs/polyglot-pre-rendered-thumbnail-copy-github.json
            outputs/polyglot-youtube-thumbnail-*.json
            outputs/youtube-polyglot-publish-ledger.jsonl
            outputs/youtube-live-publications-github.json
            outputs/youtube-publication-control-github.json
            outputs/youtube-polyglot-publish-schedule-github.json
            outputs/video-generator/*_polyglot_*
            config/youtube-channels.json
            config/youtube-polyglot-playlists.json
            config/youtube-polyglot-progress.json
            config/youtube-polyglot-published-videos.json
            config/youtube-publish-calendar.json
          if-no-files-found: ignore

  persist-polyglot-publish-state:
    needs: youtube-polyglot-video
    if: ${{ always() && inputs.mode == 'apply' && inputs.campaign_id == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: youtube-publish-state-${{ github.ref_name }}-${{ github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Download Polyglot publish state artifact
        id: download_publish_state
        uses: actions/download-artifact@v4
        with:
          name: youtube-polyglot-${{ inputs.set_id }}-${{ inputs.support }}-${{ inputs.bundle }}-${{ inputs.mode }}
          path: .state-artifact

      - name: Merge Polyglot publish state into current branch
        shell: bash
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ ! -d .state-artifact/config ]; then
            echo "::error::Polyglot upload run did not produce a publish-state artifact config directory."
            exit 1
          fi
          git fetch origin "$BRANCH_NAME"
          git checkout "$BRANCH_NAME"
          git pull --ff-only origin "$BRANCH_NAME"
          node scripts/merge-youtube-publish-state.mjs --artifact-dir=.state-artifact --summary=outputs/youtube-polyglot-state-merge-github.json
          cat outputs/youtube-polyglot-state-merge-github.json
          node scripts/check-youtube-polyglot-state.mjs --set="${{ inputs.set_id }}" --bundle="${{ inputs.bundle }}" --json

      - name: Commit and push Polyglot publish state
        shell: bash
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          SET_ID: ${{ inputs.set_id }}
          SUPPORT: ${{ inputs.support }}
          BUNDLE: ${{ inputs.bundle }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -d .state-artifact/config ]; then
            echo "::error::Polyglot upload run did not produce a publish-state artifact config directory."
            exit 1
          fi
          repo_url="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          workdir=".persist-work/final"
          git clone --branch "$BRANCH_NAME" --depth 1 "$repo_url" "$workdir"
          cp -R .state-artifact "$workdir/.state-artifact"
          (
              cd "$workdir"
              node scripts/merge-youtube-publish-state.mjs --artifact-dir=.state-artifact --summary=outputs/youtube-polyglot-state-merge-github.json
              cat outputs/youtube-polyglot-state-merge-github.json
              if git diff --quiet -- config/youtube-channels.json config/youtube-polyglot-playlists.json config/youtube-polyglot-progress.json config/youtube-polyglot-published-videos.json config/youtube-publish-calendar.json; then
                echo "No Polyglot publish state changes to commit."
                exit 0
              fi
              node scripts/check-youtube-polyglot-state.mjs --set="$SET_ID" --bundle="$BUNDLE" --json
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add config/youtube-channels.json config/youtube-polyglot-playlists.json config/youtube-polyglot-progress.json config/youtube-polyglot-published-videos.json config/youtube-publish-calendar.json
              git commit -m "Persist Polyglot YouTube publish state for ${SET_ID} ${SUPPORT} ${BUNDLE}" \
                -m "Source workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              git push origin "HEAD:$BRANCH_NAME"
          )

      - name: Upload Polyglot state merge summary
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: youtube-polyglot-publish-state-merge-${{ inputs.set_id }}-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: ignore
          path: outputs/youtube-polyglot-state-merge-github.json
