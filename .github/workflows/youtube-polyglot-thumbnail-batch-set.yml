name: YouTube Polyglot Thumbnail Batch Set

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "plan validates a prepared Polyglot report; apply calls thumbnails.set for ready rows only."
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply
      report_path:
        description: "Committed prepared Polyglot thumbnail report path."
        required: true
        default: "outputs/review/youtube-thumbnail-batch-plan-upload-eligible-polyglot-24-20260704.json"
      set_id:
        description: "Deck id to match."
        required: true
        default: "home_kitchen_cookware_pilot_01"
      support:
        description: "Support language(s) for this batch. Apply requires a non-empty single-route list."
        required: false
        default: ""
      youtube_environment:
        description: "GitHub environment for apply. Plan does not use OAuth."
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - youtube-api-branding
          - youtube-api-youtube-2
          - youtube-api-youtube-3
          - youtube-api-youtube-4
      confirm_youtube_write:
        description: "For mode=apply type APPLY_YOUTUBE_THUMBNAIL_BATCH."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: youtube-polyglot-thumbnail-batch-set-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Node dependencies
        run: npm ci || npm install

      - name: Validate prepared Polyglot thumbnail report
        shell: bash
        env:
          REPORT_PATH: ${{ github.event.inputs.report_path }}
          SET_ID: ${{ github.event.inputs.set_id }}
          SUPPORT_INPUT: ${{ github.event.inputs.support }}
          YOUTUBE_ENVIRONMENT_INPUT: ${{ github.event.inputs.youtube_environment }}
        run: |
          set -euo pipefail
          mkdir -p outputs/review
          ARGS=("--report=$REPORT_PATH" "--set-id=$SET_ID" "--output=outputs/review/youtube-polyglot-thumbnail-batch-plan-${GITHUB_RUN_ID}.json")
          if [ -n "$(printf '%s' "$SUPPORT_INPUT" | xargs)" ]; then
            ARGS+=("--support=$SUPPORT_INPUT")
          fi
          if [ "$YOUTUBE_ENVIRONMENT_INPUT" != "auto" ]; then
            ARGS+=("--youtube-environment=$YOUTUBE_ENVIRONMENT_INPUT")
          fi
          node scripts/plan-youtube-polyglot-thumbnail-batch-from-report.mjs "${ARGS[@]}"

      - name: Upload Polyglot thumbnail plan artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: youtube-polyglot-thumbnail-batch-plan-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: outputs/review/youtube-polyglot-thumbnail-batch-plan-${{ github.run_id }}.json

  apply:
    needs: plan
    if: ${{ github.event.inputs.mode == 'apply' }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.youtube_environment }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Refuse unsafe apply inputs
        shell: bash
        env:
          SUPPORT_INPUT: ${{ github.event.inputs.support }}
          YOUTUBE_ENVIRONMENT_INPUT: ${{ github.event.inputs.youtube_environment }}
          CONFIRM_YOUTUBE_WRITE: ${{ github.event.inputs.confirm_youtube_write }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM_YOUTUBE_WRITE" != "APPLY_YOUTUBE_THUMBNAIL_BATCH" ]; then
            echo "::error::mode=apply requires confirm_youtube_write=APPLY_YOUTUBE_THUMBNAIL_BATCH"
            exit 1
          fi
          if [ -z "$(printf '%s' "$SUPPORT_INPUT" | xargs)" ]; then
            echo "::error::mode=apply requires an explicit support list."
            exit 1
          fi
          if [ "$YOUTUBE_ENVIRONMENT_INPUT" = "auto" ]; then
            echo "::error::mode=apply requires an explicit youtube_environment."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Node dependencies
        run: npm ci || npm install

      - name: Validate YouTube API route environment
        shell: bash
        env:
          SUPPORT_INPUT: ${{ github.event.inputs.support }}
          YOUTUBE_ENVIRONMENT_INPUT: ${{ github.event.inputs.youtube_environment }}
        run: |
          set -euo pipefail
          node scripts/resolve-youtube-api-environment.mjs --support="$SUPPORT_INPUT" --environment="$YOUTUBE_ENVIRONMENT_INPUT"

      - name: Restore YouTube OAuth bundle from environment secret
        env:
          YOUTUBE_OAUTH_BUNDLE_TGZ_B64: ${{ secrets.YOUTUBE_OAUTH_BUNDLE_TGZ_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${YOUTUBE_OAUTH_BUNDLE_TGZ_B64:-}" ]; then
            echo "::error::Missing environment secret YOUTUBE_OAUTH_BUNDLE_TGZ_B64"
            exit 1
          fi
          printf '%s' "$YOUTUBE_OAUTH_BUNDLE_TGZ_B64" | base64 -d | tar -xzf -
          test -f .local/youtube-oauth/google-oauth-client.json
          test -d .local/youtube-oauth/tokens

      - name: Rebuild Polyglot apply plan
        shell: bash
        env:
          REPORT_PATH: ${{ github.event.inputs.report_path }}
          SET_ID: ${{ github.event.inputs.set_id }}
          SUPPORT_INPUT: ${{ github.event.inputs.support }}
          YOUTUBE_ENVIRONMENT_INPUT: ${{ github.event.inputs.youtube_environment }}
        run: |
          set -euo pipefail
          mkdir -p outputs/review
          node scripts/plan-youtube-polyglot-thumbnail-batch-from-report.mjs \
            "--report=$REPORT_PATH" \
            "--set-id=$SET_ID" \
            "--support=$SUPPORT_INPUT" \
            "--youtube-environment=$YOUTUBE_ENVIRONMENT_INPUT" \
            "--output=outputs/review/youtube-polyglot-thumbnail-batch-apply-plan-${GITHUB_RUN_ID}.json" \
            --fail-on-blockers

      - name: Apply ready Polyglot thumbnail rows
        shell: bash
        env:
          PLAN_REPORT: outputs/review/youtube-polyglot-thumbnail-batch-apply-plan-${{ github.run_id }}.json
          YOUTUBE_ENVIRONMENT_INPUT: ${{ github.event.inputs.youtube_environment }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const cp = require("node:child_process");
          const fs = require("node:fs");
          const path = require("node:path");
          const report = JSON.parse(fs.readFileSync(process.env.PLAN_REPORT, "utf8"));
          if (report.blockedRows.length) {
            console.error(`Refusing apply because plan has ${report.blockedRows.length} blocked row(s).`);
            process.exit(1);
          }
          if (!report.readyRows.length) {
            console.error("Refusing apply because plan has no ready rows.");
            process.exit(1);
          }
          for (const row of report.readyRows) {
            if (row.routeEnvironment !== process.env.YOUTUBE_ENVIRONMENT_INPUT) {
              console.error(`Route mismatch for ${row.supportLang}/${row.bundleKey}: expected ${row.routeEnvironment}, got ${process.env.YOUTUBE_ENVIRONMENT_INPUT}`);
              process.exit(1);
            }
            const args = [
              "scripts/youtube-set-video-thumbnail.mjs",
              `--video-id=${row.youtubeVideoId}`,
              `--set-id=${row.setId}`,
              `--support=${row.supportLang}`,
              `--thumbnail=${row.thumbnail}`,
              "--publication-registry=config/youtube-polyglot-published-videos.json",
              "--ledger=outputs/youtube-polyglot-thumbnail-ledger.jsonl",
              "--apply",
              "--confirm-youtube-write",
            ];
            console.log(`Setting Polyglot thumbnail for support=${row.supportLang} bundle=${row.bundleKey} video=${row.youtubeVideoId} thumbnail=${path.basename(row.thumbnail)}`);
            cp.execFileSync(process.execPath, args, { stdio: "inherit" });
          }
          NODE

      - name: Upload non-secret Polyglot thumbnail apply artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: youtube-polyglot-thumbnail-batch-apply-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            outputs/review/youtube-polyglot-thumbnail-batch-apply-plan-${{ github.run_id }}.json
            outputs/youtube-polyglot-thumbnail-ledger.jsonl
            config/youtube-polyglot-published-videos.json
            config/youtube-channels.json

  persist-thumbnail-state:
    needs: apply
    if: ${{ always() && github.event.inputs.mode == 'apply' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: youtube-polyglot-thumbnail-batch-state-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Download Polyglot thumbnail apply artifact
        id: download_polyglot_thumbnail_apply_state
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: youtube-polyglot-thumbnail-batch-apply-${{ github.run_id }}
          path: .state-artifact

      - name: Persist Polyglot thumbnail state into current branch
        shell: bash
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ ! -f .state-artifact/config/youtube-polyglot-published-videos.json ]; then
            echo "No Polyglot thumbnail state artifact found; nothing to persist."
            exit 0
          fi
          git fetch origin "$BRANCH_NAME"
          git checkout "$BRANCH_NAME"
          git pull --ff-only origin "$BRANCH_NAME"
          cp .state-artifact/config/youtube-polyglot-published-videos.json config/youtube-polyglot-published-videos.json
          cp .state-artifact/config/youtube-channels.json config/youtube-channels.json
          if git diff --quiet -- config/youtube-polyglot-published-videos.json config/youtube-channels.json; then
            echo "No Polyglot thumbnail state changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/youtube-polyglot-published-videos.json config/youtube-channels.json
          git commit -m "chore: persist Polyglot YouTube thumbnail state"
          git push origin "$BRANCH_NAME"
