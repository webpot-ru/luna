name: YouTube Shorts Publish

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "plan validates inputs only; render builds an MP4; apply renders and uploads to YouTube."
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - render
          - apply
      set_id:
        description: "Set ID of the deck to compile into a Short."
        required: true
        default: "home_bathroom_essentials_a1"
      support:
        description: "One support/viewer/channel language code."
        required: true
        default: "RU"
      target:
        description: "One studied target language code."
        required: true
        default: "ES"
      shorts_format:
        description: "Shorts format id."
        required: true
        default: "word_quiz_3_2_1"
        type: choice
        options:
          - word_quiz_3_2_1
          - audio_first_quiz
          - say_it_before_me
          - three_words_one_scene
          - which_one_is_correct
          - speed_loop_5_words
          - phrase_ladder
          - visual_object_flash
      card_limit:
        description: "Learning card count for the Short."
        required: true
        default: "5"
      quiz_limit:
        description: "Mini-quiz card count. Use 0 to render no quiz questions."
        required: true
        default: "2"
      transition:
        description: "Portrait card transition style."
        required: true
        default: "flip"
        type: choice
        options:
          - flip
          - static
      youtube_environment:
        description: "GitHub environment with the support route OAuth bundle. Use auto for one support channel."
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - youtube-api-branding
          - youtube-api-youtube-2
          - youtube-api-youtube-3
          - youtube-api-youtube-4
      privacy:
        description: "YouTube video privacy. Scheduled publish uses private + publish_at."
        required: true
        default: "public"
        type: choice
        options:
          - public
          - unlisted
          - private
      publish_at:
        description: "Optional ISO timestamp for scheduled upload. Requires privacy=private."
        required: false
        default: ""
      allow_republish:
        description: "Allow uploading the same shortsKey already active in config/youtube-shorts-published-videos.json."
        required: true
        default: false
        type: boolean
      confirm_render:
        description: "For render/apply type RENDER_SHORTS_VIDEO."
        required: false
        default: ""
      confirm_tts:
        description: "For render/apply type GENERATE_TTS_AUDIO."
        required: false
        default: ""
      confirm_youtube_write:
        description: "For apply type APPLY_SHORTS_YOUTUBE_UPLOAD."
        required: false
        default: ""
      confirm_public:
        description: "For public or scheduled videos type PUBLISH_PUBLIC."
        required: false
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: youtube-shorts-${{ github.event.inputs.set_id }}-${{ github.event.inputs.support }}-${{ github.event.inputs.target }}-${{ github.event.inputs.shorts_format }}-${{ github.event.inputs.mode }}
  cancel-in-progress: false

jobs:
  youtube-shorts:
    runs-on: ubuntu-latest
    environment:
      name: >-
        ${{
          github.event.inputs.youtube_environment != 'auto' && github.event.inputs.youtube_environment ||
          (contains('|EN|EN-GB|ES|ES-419|PT|PT-BR|RU|HI|ID|FR|DE|JA|KO|TR|ZH|en|en-gb|es|es-419|pt|pt-br|ru|hi|id|fr|de|ja|ko|tr|zh|', format('|{0}|', github.event.inputs.support)) && 'youtube-api-branding') ||
          (contains('|VI|TH|MS|PL|NL|SV|NO|DA|FI|CS|SK|HU|RO|vi|th|ms|pl|nl|sv|no|da|fi|cs|sk|hu|ro|', format('|{0}|', github.event.inputs.support)) && 'youtube-api-youtube-2') ||
          (contains('|BG|HR|SR|SL|LT|LV|ET|IS|BN|TL|MY|KM|LO|bg|hr|sr|sl|lt|lv|et|is|bn|tl|my|km|lo|', format('|{0}|', github.event.inputs.support)) && 'youtube-api-youtube-3') ||
          (contains('|NE|SI|TA|TE|KN|ML|UZ|KK|AZ|KA|HY|SW|IT|ne|si|ta|te|kn|ml|uz|kk|az|ka|hy|sw|it|', format('|{0}|', github.event.inputs.support)) && 'youtube-api-youtube-4') ||
          'youtube-api-branding'
        }}
    timeout-minutes: 180
    env:
      EFFECTIVE_YOUTUBE_ENVIRONMENT: >-
        ${{
          github.event.inputs.youtube_environment != 'auto' && github.event.inputs.youtube_environment ||
          (contains('|EN|EN-GB|ES|ES-419|PT|PT-BR|RU|HI|ID|FR|DE|JA|KO|TR|ZH|en|en-gb|es|es-419|pt|pt-br|ru|hi|id|fr|de|ja|ko|tr|zh|', format('|{0}|', github.event.inputs.support)) && 'youtube-api-branding') ||
          (contains('|VI|TH|MS|PL|NL|SV|NO|DA|FI|CS|SK|HU|RO|vi|th|ms|pl|nl|sv|no|da|fi|cs|sk|hu|ro|', format('|{0}|', github.event.inputs.support)) && 'youtube-api-youtube-2') ||
          (contains('|BG|HR|SR|SL|LT|LV|ET|IS|BN|TL|MY|KM|LO|bg|hr|sr|sl|lt|lv|et|is|bn|tl|my|km|lo|', format('|{0}|', github.event.inputs.support)) && 'youtube-api-youtube-3') ||
          (contains('|NE|SI|TA|TE|KN|ML|UZ|KK|AZ|KA|HY|SW|IT|ne|si|ta|te|kn|ml|uz|kk|az|ka|hy|sw|it|', format('|{0}|', github.event.inputs.support)) && 'youtube-api-youtube-4') ||
          'youtube-api-branding'
        }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Refuse unsafe Shorts inputs
        shell: bash
        env:
          MODE: ${{ github.event.inputs.mode }}
          SUPPORT: ${{ github.event.inputs.support }}
          TARGET: ${{ github.event.inputs.target }}
          CARD_LIMIT: ${{ github.event.inputs.card_limit }}
          QUIZ_LIMIT: ${{ github.event.inputs.quiz_limit }}
          PRIVACY: ${{ github.event.inputs.privacy }}
          PUBLISH_AT: ${{ github.event.inputs.publish_at }}
          CONFIRM_RENDER: ${{ github.event.inputs.confirm_render }}
          CONFIRM_TTS: ${{ github.event.inputs.confirm_tts }}
          CONFIRM_YOUTUBE_WRITE: ${{ github.event.inputs.confirm_youtube_write }}
          CONFIRM_PUBLIC: ${{ github.event.inputs.confirm_public }}
        run: |
          set -euo pipefail
          support_clean="$(printf '%s' "$SUPPORT" | tr '[:lower:]' '[:upper:]' | xargs)"
          target_clean="$(printf '%s' "$TARGET" | tr '[:lower:]' '[:upper:]' | xargs)"
          if [ "$support_clean" = "ALL" ] || printf '%s' "$support_clean" | grep -q ','; then
            echo "::error::Shorts workflow accepts exactly one explicit support language."
            exit 1
          fi
          if [ "$target_clean" = "ALL" ] || [ -z "$target_clean" ] || printf '%s' "$target_clean" | grep -q ','; then
            echo "::error::Shorts workflow accepts exactly one explicit target language."
            exit 1
          fi
          if ! printf '%s' "$CARD_LIMIT" | grep -Eq '^[0-9]+$' || [ "$CARD_LIMIT" -lt 1 ] || [ "$CARD_LIMIT" -gt 12 ]; then
            echo "::error::card_limit must be an integer between 1 and 12."
            exit 1
          fi
          if ! printf '%s' "$QUIZ_LIMIT" | grep -Eq '^[0-9]+$' || [ "$QUIZ_LIMIT" -gt 6 ]; then
            echo "::error::quiz_limit must be an integer between 0 and 6."
            exit 1
          fi
          if [ "$MODE" != "plan" ] && [ "$CONFIRM_RENDER" != "RENDER_SHORTS_VIDEO" ]; then
            echo "::error::render/apply requires confirm_render=RENDER_SHORTS_VIDEO"
            exit 1
          fi
          if [ "$MODE" != "plan" ] && [ "$CONFIRM_TTS" != "GENERATE_TTS_AUDIO" ]; then
            echo "::error::render/apply may spend TTS/provider usage and requires confirm_tts=GENERATE_TTS_AUDIO"
            exit 1
          fi
          if [ "$MODE" = "apply" ] && [ "$CONFIRM_YOUTUBE_WRITE" != "APPLY_SHORTS_YOUTUBE_UPLOAD" ]; then
            echo "::error::mode=apply requires confirm_youtube_write=APPLY_SHORTS_YOUTUBE_UPLOAD"
            exit 1
          fi
          if [ "$PRIVACY" = "public" ] && [ "$MODE" = "apply" ] && [ "$CONFIRM_PUBLIC" != "PUBLISH_PUBLIC" ]; then
            echo "::error::privacy=public requires confirm_public=PUBLISH_PUBLIC"
            exit 1
          fi
          if [ -n "$PUBLISH_AT" ] && [ "$PRIVACY" != "private" ]; then
            echo "::error::publish_at requires privacy=private"
            exit 1
          fi
          if [ -n "$PUBLISH_AT" ] && [ "$MODE" = "apply" ] && [ "$CONFIRM_PUBLIC" != "PUBLISH_PUBLIC" ]; then
            echo "::error::scheduled uploads become public at publish_at and require confirm_public=PUBLISH_PUBLIC"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate YouTube API route environment
        shell: bash
        env:
          SUPPORT_INPUT: ${{ github.event.inputs.support }}
          YOUTUBE_ENVIRONMENT_INPUT: ${{ github.event.inputs.youtube_environment }}
        run: |
          set -euo pipefail
          node scripts/resolve-youtube-api-environment.mjs --support="$SUPPORT_INPUT" --environment="$EFFECTIVE_YOUTUBE_ENVIRONMENT"
          if [ "$YOUTUBE_ENVIRONMENT_INPUT" != "auto" ]; then
            node scripts/resolve-youtube-api-environment.mjs --support="$SUPPORT_INPUT" --environment="$YOUTUBE_ENVIRONMENT_INPUT"
          fi
          echo "Effective YouTube API environment: $EFFECTIVE_YOUTUBE_ENVIRONMENT"

      - name: Install Node dependencies
        run: npm ci || npm install

      - name: Download offline deck data from Google Drive
        shell: bash
        run: |
          set -euo pipefail
          SET_ID="${{ github.event.inputs.set_id }}"
          FILE_ID=$(node -e "
            const fs = require('fs');
            const path = require('path');
            const mappingPath = path.resolve('data/deck-sources.json');
            if (fs.existsSync(mappingPath)) {
              const mapping = JSON.parse(fs.readFileSync(mappingPath, 'utf8'));
              console.log(mapping['$SET_ID'] || '');
            }
          ")
          if [ -n "$FILE_ID" ] && [ "$FILE_ID" != "YOUR_GOOGLE_DRIVE_FILE_ID_HERE" ]; then
            echo "Found Google Drive File ID for $SET_ID."
            mkdir -p data/decks
            curl -c /tmp/cookies -sL "https://docs.google.com/uc?export=download&id=${FILE_ID}" > /tmp/confirm.html
            CONFIRM=$(grep -o 'confirm=[^&\" ]*' /tmp/confirm.html | head -n1 | cut -d= -f2 || true)
            if [ -n "$CONFIRM" ]; then
              curl -Lb /tmp/cookies "https://docs.google.com/uc?export=download&confirm=${CONFIRM}&id=${FILE_ID}" -o "data/decks/${SET_ID}.json"
            else
              curl -Lb /tmp/cookies "https://docs.google.com/uc?export=download&id=${FILE_ID}" -o "data/decks/${SET_ID}.json"
            fi
            test -s "data/decks/${SET_ID}.json"
            echo "Downloaded offline data to data/decks/${SET_ID}.json"
          else
            echo "No Google Drive File ID found for $SET_ID in data/deck-sources.json. Render will require a committed/local data/decks/${SET_ID}.json or DB access."
          fi

      - name: Validate Shorts localization packs
        run: |
          npm run check:shorts-outro-localization
          npm run check:shorts-format-localization

      - name: Write Shorts plan summary
        shell: bash
        env:
          SET_ID: ${{ github.event.inputs.set_id }}
          SUPPORT: ${{ github.event.inputs.support }}
          TARGET: ${{ github.event.inputs.target }}
          SHORTS_FORMAT: ${{ github.event.inputs.shorts_format }}
        run: |
          set -euo pipefail
          mkdir -p outputs
          node -e '
            const fs = require("fs");
            const setId = process.env.SET_ID;
            const support = String(process.env.SUPPORT || "").toUpperCase();
            const target = String(process.env.TARGET || "").toUpperCase();
            const format = process.env.SHORTS_FORMAT;
            const summary = {
              generatedAt: new Date().toISOString(),
              videoType: "shorts",
              shortsKey: ["shorts", setId, support, target, format].join(":"),
              setId,
              supportLang: support,
              targetLang: target,
              shortsFormat: format,
            };
            fs.writeFileSync("outputs/youtube-shorts-plan-github.json", JSON.stringify(summary, null, 2) + "\n");
            console.log(JSON.stringify(summary, null, 2));
            if (process.env.GITHUB_STEP_SUMMARY) {
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
                "### Shorts plan",
                "",
                `- Shorts key: ${summary.shortsKey}`,
                `- Set: ${setId}`,
                `- Support: ${support}`,
                `- Target: ${target}`,
                `- Format: ${format}`,
                "",
              ].join("\n"));
            }
          '

      - name: Install render dependencies
        if: ${{ github.event.inputs.mode != 'plan' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npx playwright install chromium --with-deps

      - name: Set up Python for audio render
        if: ${{ github.event.inputs.mode != 'plan' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python TTS dependency
        if: ${{ github.event.inputs.mode != 'plan' }}
        run: pip install edge-tts

      - name: Restore YouTube OAuth bundle from environment secret
        if: ${{ github.event.inputs.mode == 'apply' }}
        env:
          YOUTUBE_OAUTH_BUNDLE_TGZ_B64: ${{ secrets.YOUTUBE_OAUTH_BUNDLE_TGZ_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${YOUTUBE_OAUTH_BUNDLE_TGZ_B64:-}" ]; then
            echo "::error::Missing environment secret YOUTUBE_OAUTH_BUNDLE_TGZ_B64"
            exit 1
          fi
          printf '%s' "$YOUTUBE_OAUTH_BUNDLE_TGZ_B64" | base64 -d | tar -xzf -
          test -f .local/youtube-oauth/google-oauth-client.json
          test -d .local/youtube-oauth/tokens
          echo "YouTube OAuth bundle restored for environment $EFFECTIVE_YOUTUBE_ENVIRONMENT."

      - name: Render Shorts video
        if: ${{ github.event.inputs.mode != 'plan' }}
        shell: bash
        env:
          AI33_API_KEY: ${{ secrets.AI33_API_KEY }}
          SET_ID: ${{ github.event.inputs.set_id }}
          SUPPORT: ${{ github.event.inputs.support }}
          TARGET: ${{ github.event.inputs.target }}
          SHORTS_FORMAT: ${{ github.event.inputs.shorts_format }}
          CARD_LIMIT: ${{ github.event.inputs.card_limit }}
          QUIZ_LIMIT: ${{ github.event.inputs.quiz_limit }}
          TRANSITION: ${{ github.event.inputs.transition }}
        run: |
          set -euo pipefail
          npm run build:deck-shorts -- \
            --set "$SET_ID" \
            --target "$TARGET" \
            --support "$SUPPORT" \
            --card-limit "$CARD_LIMIT" \
            --quiz-limit "$QUIZ_LIMIT" \
            --transition "$TRANSITION" \
            --shorts-format "$SHORTS_FORMAT"

      - name: Plan Shorts YouTube upload
        if: ${{ github.event.inputs.mode != 'plan' }}
        shell: bash
        env:
          ALLOW_REPUBLISH: ${{ github.event.inputs.allow_republish }}
        run: |
          set -euo pipefail
          UPLOAD_PLAN_ARGS=(
            "outputs/shorts-generator"
            "--allow-auto-thumbnail-fallback"
            "--publication-registry=config/youtube-shorts-published-videos.json"
            "--output=outputs/youtube-shorts-publish-plan-github.json"
          )
          if [ "$ALLOW_REPUBLISH" = "true" ]; then
            UPLOAD_PLAN_ARGS+=("--allow-republish")
          fi
          npm run plan:youtube-publish -- "${UPLOAD_PLAN_ARGS[@]}"

      - name: Gate Shorts upload plan
        if: ${{ github.event.inputs.mode == 'apply' }}
        shell: bash
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const report = JSON.parse(fs.readFileSync("outputs/youtube-shorts-publish-plan-github.json", "utf8"));
            const s = report.summary || {};
            console.log(JSON.stringify(s, null, 2));
            if (s.candidateCount !== 1) throw new Error(`Shorts apply expects exactly one candidate, got ${s.candidateCount || 0}.`);
            if (s.blockerCount) throw new Error("Shorts upload plan has blockers.");
            if (s.publishReadyCount !== s.candidateCount) throw new Error("Shorts candidate is not publish_ready.");
            const candidate = report.candidates?.[0] || {};
            if (candidate.videoType !== "shorts") throw new Error(`Expected videoType=shorts, got ${candidate.videoType || "(missing)"}.`);
            if (candidate.playlist) throw new Error("Shorts upload must not use a playlist assignment.");
          '

      - name: Upload Short to YouTube
        if: ${{ github.event.inputs.mode == 'apply' }}
        shell: bash
        env:
          ALLOW_REPUBLISH: ${{ github.event.inputs.allow_republish }}
          PRIVACY: ${{ github.event.inputs.privacy }}
          PUBLISH_AT: ${{ github.event.inputs.publish_at }}
          YOUTUBE_API_RETRY_ATTEMPTS: "7"
          YOUTUBE_API_RETRY_BASE_MS: "4000"
          YOUTUBE_API_RETRY_JITTER_MS: "4000"
          YOUTUBE_API_RETRY_MAX_MS: "90000"
          YOUTUBE_VIDEO_READBACK_ATTEMPTS: "6"
          YOUTUBE_VIDEO_READBACK_BASE_MS: "6000"
          YOUTUBE_VIDEO_READBACK_MAX_MS: "60000"
        run: |
          set -euo pipefail
          mapfile -d '' METADATA_FILES < <(find outputs/shorts-generator -name youtube_metadata.json -print0 | sort -z)
          if [ "${#METADATA_FILES[@]}" -ne 1 ]; then
            echo "::error::Shorts apply expects exactly one youtube_metadata.json, got ${#METADATA_FILES[@]}."
            exit 1
          fi
          PUBLISH_ARGS=(
            "--metadata=${METADATA_FILES[0]}"
            "--privacy=$PRIVACY"
            "--publication-registry=config/youtube-shorts-published-videos.json"
            "--ledger=outputs/youtube-shorts-publish-ledger.jsonl"
            "--apply"
            "--confirm-youtube-write"
          )
          if [ -n "$PUBLISH_AT" ]; then
            PUBLISH_ARGS+=("--publish-at=$PUBLISH_AT")
          fi
          if [ "$ALLOW_REPUBLISH" = "true" ]; then
            PUBLISH_ARGS+=("--allow-republish")
          fi
          if [ "$PRIVACY" = "public" ] || [ -n "$PUBLISH_AT" ]; then
            PUBLISH_ARGS+=("--confirm-public")
          fi
          npm run apply:youtube-publish -- "${PUBLISH_ARGS[@]}"

      - name: Upload Shorts plan/render artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: youtube-shorts-${{ github.event.inputs.set_id }}-${{ github.event.inputs.support }}-${{ github.event.inputs.target }}-${{ github.event.inputs.shorts_format }}-${{ github.event.inputs.mode }}-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            outputs/youtube-shorts-plan-github.json
            outputs/youtube-shorts-publish-plan-github.json
            outputs/youtube-shorts-publish-ledger.jsonl
            outputs/shorts-generator/
            config/youtube-channels.json
            config/youtube-shorts-published-videos.json

  persist-shorts-publish-state:
    needs: youtube-shorts
    if: ${{ always() && github.event.inputs.mode == 'apply' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: youtube-shorts-publish-state-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Download Shorts publish state artifact
        id: download_publish_state
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: youtube-shorts-${{ github.event.inputs.set_id }}-${{ github.event.inputs.support }}-${{ github.event.inputs.target }}-${{ github.event.inputs.shorts_format }}-${{ github.event.inputs.mode }}-${{ github.run_id }}
          path: .state-artifact

      - name: Merge Shorts publish state into current branch
        shell: bash
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ ! -d .state-artifact/config ]; then
            echo "No Shorts publish state artifact config directory found; nothing to persist."
            exit 0
          fi
          git fetch origin "$BRANCH_NAME"
          git checkout "$BRANCH_NAME"
          git pull --ff-only origin "$BRANCH_NAME"
          node scripts/merge-youtube-publish-state.mjs --artifact-dir=.state-artifact --summary=outputs/youtube-shorts-state-merge-github.json
          cat outputs/youtube-shorts-state-merge-github.json

      - name: Commit and push Shorts publish state
        shell: bash
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          SET_ID: ${{ github.event.inputs.set_id }}
          SUPPORT: ${{ github.event.inputs.support }}
          TARGET: ${{ github.event.inputs.target }}
          SHORTS_FORMAT: ${{ github.event.inputs.shorts_format }}
        run: |
          set -euo pipefail
          if git diff --quiet -- config/youtube-channels.json config/youtube-shorts-published-videos.json; then
            echo "No Shorts publish state changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/youtube-channels.json config/youtube-shorts-published-videos.json
          git commit -m "Persist Shorts YouTube publish state for ${SET_ID} ${SUPPORT} ${TARGET} ${SHORTS_FORMAT}" \
            -m "Source workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          git push origin "HEAD:$BRANCH_NAME"

      - name: Upload Shorts state merge summary
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: youtube-shorts-publish-state-merge-${{ github.event.inputs.set_id }}-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: ignore
          path: outputs/youtube-shorts-state-merge-github.json
