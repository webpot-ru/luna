name: YouTube Thumbnail Set

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: "Existing YouTube video id to update with a custom thumbnail."
        required: true
      source_run_id:
        description: "GitHub Actions run id containing youtube_metadata.json and youtube_thumbnail.jpg artifacts. Not required when use_repo_thumbnail=true."
        required: false
        default: ""
      use_repo_thumbnail:
        description: "Use pre-rendered thumbnail from by-support/ in the repository instead of a source run artifact. Set to true for home_kitchen_cookware_pilot_01 — no source_run_id needed."
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      set_id:
        description: "Set ID used to match the metadata artifact."
        required: true
        default: "home_kitchen_cookware_pilot_01"
      support:
        description: "Support/viewer language for the target channel."
        required: true
      target:
        description: "Target language in the video lesson."
        required: true
      generate_if_missing:
        description: "Generate youtube_thumbnail.jpg through VectorEngine when the source artifact has only automatic-thumbnail metadata."
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      confirm_thumbnail_spend:
        description: "For VectorEngine thumbnail generation type GENERATE_THUMBNAILS."
        required: false
        default: ""
      youtube_environment:
        description: "GitHub environment with the support route OAuth bundle. Use auto for one support channel."
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - youtube-api-branding
          - youtube-api-youtube-2
          - youtube-api-youtube-3
          - youtube-api-youtube-4
      confirm_youtube_write:
        description: "Type SET_YOUTUBE_THUMBNAIL to call youtube.thumbnails.set."
        required: true
        default: ""

permissions:
  contents: read
  actions: read
  # write needed to commit updated config when persist is added in future

concurrency:
  group: youtube-thumbnail-set-${{ github.event.inputs.video_id }}
  cancel-in-progress: false

jobs:
  set-thumbnail:
    runs-on: ubuntu-latest
    environment:
      name: >-
        ${{
          github.event.inputs.youtube_environment != 'auto' && github.event.inputs.youtube_environment ||
          (contains('|EN|EN-GB|ES|ES-419|PT|PT-BR|RU|HI|ID|FR|DE|JA|KO|TR|ZH|en|en-gb|es|es-419|pt|pt-br|ru|hi|id|fr|de|ja|ko|tr|zh|', format('|{0}|', github.event.inputs.support)) && 'youtube-api-branding') ||
          (contains('|VI|TH|MS|PL|NL|SV|NO|DA|FI|CS|SK|HU|RO|vi|th|ms|pl|nl|sv|no|da|fi|cs|sk|hu|ro|', format('|{0}|', github.event.inputs.support)) && 'youtube-api-youtube-2') ||
          (contains('|BG|HR|SR|SL|LT|LV|ET|IS|BN|TL|MY|KM|LO|bg|hr|sr|sl|lt|lv|et|is|bn|tl|my|km|lo|', format('|{0}|', github.event.inputs.support)) && 'youtube-api-youtube-3') ||
          (contains('|NE|SI|TA|TE|KN|ML|UZ|KK|AZ|KA|HY|SW|IT|ne|si|ta|te|kn|ml|uz|kk|az|ka|hy|sw|it|', format('|{0}|', github.event.inputs.support)) && 'youtube-api-youtube-4') ||
          'youtube-api-branding'
        }}
    timeout-minutes: 30
    env:
      EFFECTIVE_YOUTUBE_ENVIRONMENT: >-
        ${{
          github.event.inputs.youtube_environment != 'auto' && github.event.inputs.youtube_environment ||
          (contains('|EN|EN-GB|ES|ES-419|PT|PT-BR|RU|HI|ID|FR|DE|JA|KO|TR|ZH|en|en-gb|es|es-419|pt|pt-br|ru|hi|id|fr|de|ja|ko|tr|zh|', format('|{0}|', github.event.inputs.support)) && 'youtube-api-branding') ||
          (contains('|VI|TH|MS|PL|NL|SV|NO|DA|FI|CS|SK|HU|RO|vi|th|ms|pl|nl|sv|no|da|fi|cs|sk|hu|ro|', format('|{0}|', github.event.inputs.support)) && 'youtube-api-youtube-2') ||
          (contains('|BG|HR|SR|SL|LT|LV|ET|IS|BN|TL|MY|KM|LO|bg|hr|sr|sl|lt|lv|et|is|bn|tl|my|km|lo|', format('|{0}|', github.event.inputs.support)) && 'youtube-api-youtube-3') ||
          (contains('|NE|SI|TA|TE|KN|ML|UZ|KK|AZ|KA|HY|SW|IT|ne|si|ta|te|kn|ml|uz|kk|az|ka|hy|sw|it|', format('|{0}|', github.event.inputs.support)) && 'youtube-api-youtube-4') ||
          'youtube-api-branding'
        }}

    steps:
      - name: Check confirmation
        shell: bash
        env:
          CONFIRM_YOUTUBE_WRITE: ${{ github.event.inputs.confirm_youtube_write }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM_YOUTUBE_WRITE" != "SET_YOUTUBE_THUMBNAIL" ]; then
            echo "::error::Live thumbnail write requires confirm_youtube_write=SET_YOUTUBE_THUMBNAIL"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci || npm install

      - name: Install ffmpeg for generated thumbnails
        if: github.event.inputs.generate_if_missing == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Validate YouTube environment route
        shell: bash
        env:
          SUPPORT_INPUT: ${{ github.event.inputs.support }}
          YOUTUBE_ENVIRONMENT_INPUT: ${{ github.event.inputs.youtube_environment }}
        run: |
          set -euo pipefail
          if [ "$YOUTUBE_ENVIRONMENT_INPUT" = "auto" ]; then
            node scripts/resolve-youtube-api-environment.mjs --support="$SUPPORT_INPUT" --environment="$EFFECTIVE_YOUTUBE_ENVIRONMENT"
          else
            node scripts/resolve-youtube-api-environment.mjs --support="$SUPPORT_INPUT" --environment="$YOUTUBE_ENVIRONMENT_INPUT"
          fi
          echo "Effective YouTube API environment: $EFFECTIVE_YOUTUBE_ENVIRONMENT"

      - name: Restore YouTube OAuth bundle from environment secret
        env:
          YOUTUBE_OAUTH_BUNDLE_TGZ_B64: ${{ secrets.YOUTUBE_OAUTH_BUNDLE_TGZ_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${YOUTUBE_OAUTH_BUNDLE_TGZ_B64:-}" ]; then
            echo "::error::Missing environment secret YOUTUBE_OAUTH_BUNDLE_TGZ_B64"
            exit 1
          fi
          printf '%s' "$YOUTUBE_OAUTH_BUNDLE_TGZ_B64" | base64 -d | tar -xzf -
          test -f .local/youtube-oauth/google-oauth-client.json
          test -d .local/youtube-oauth/tokens
          echo "YouTube OAuth bundle restored for environment $EFFECTIVE_YOUTUBE_ENVIRONMENT."

      - name: Resolve thumbnail from repository by-support/ folder
        if: github.event.inputs.use_repo_thumbnail == 'true'
        id: repo_thumbnail
        shell: bash
        env:
          SET_ID: ${{ github.event.inputs.set_id }}
          SUPPORT: ${{ github.event.inputs.support }}
          TARGET: ${{ github.event.inputs.target }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const support = String(process.env.SUPPORT || "").trim().toUpperCase();
          const target  = String(process.env.TARGET  || "").trim().toUpperCase();
          const setId   = String(process.env.SET_ID  || "").trim();

          // Candidate base directories (ordered by preference)
          const bases = [
            `outputs/design-prototypes/youtube-thumbnail-${setId}-ordinary-target-language-large-pair-folders-20260704/by-support`,
            `outputs/design-prototypes/youtube-thumbnail-${setId}-ordinary-target-language-large-pair-folders-20260704-scheduled-only-20260705/by-support`,
          ];

          let found = null;
          for (const base of bases) {
            if (!fs.existsSync(base)) continue;
            // Support dir: e.g. SW__Swahili or NE__Nepali
            const supportDirs = fs.readdirSync(base).filter(d => d.startsWith(support + "__"));
            for (const sd of supportDirs) {
              const pairBase = path.join(base, sd);
              // Pair dir: e.g. SW__SK__Swahili_to_Slovak
              const pairDirs = fs.readdirSync(pairBase).filter(d => {
                const parts = d.split("__");
                return parts[0] === support && parts[1] === target;
              });
              for (const pd of pairDirs) {
                const thumb = path.join(pairBase, pd, "youtube_thumbnail.jpg");
                if (fs.existsSync(thumb)) { found = thumb; break; }
              }
              if (found) break;
            }
            if (found) break;
          }

          if (!found) {
            console.error(`No pre-rendered thumbnail found in by-support/ for ${support}→${target} (set: ${setId}).`);
            console.error("Make sure you are on the correct branch (codex/norwegian-course-url-repair-48) and the file is committed.");
            process.exit(1);
          }

          // Copy thumbnail to a predictable temp location
          const dest = `/tmp/repo-thumbnail-${support}-${target}.jpg`;
          fs.copyFileSync(found, dest);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `thumbnail=${dest}\n`);
          console.log(`✅ Found repo thumbnail: ${found}`);
          console.log(`   Copied to: ${dest}`);
          NODE

      - name: Download source run artifacts
        if: github.event.inputs.use_repo_thumbnail != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.inputs.source_run_id }}
        run: |
          set -euo pipefail
          if [ -z "${SOURCE_RUN_ID:-}" ]; then
            echo "::error::source_run_id is required when use_repo_thumbnail=false"
            exit 1
          fi
          mkdir -p /tmp/youtube-thumbnail-source
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir /tmp/youtube-thumbnail-source
          find /tmp/youtube-thumbnail-source -name youtube_metadata.json -o -name youtube_thumbnail.jpg | sort | head -n 40

      - name: Locate matching metadata and thumbnail (from artifact)
        id: locate
        if: github.event.inputs.use_repo_thumbnail != 'true'
        shell: bash
        env:
          SET_ID: ${{ github.event.inputs.set_id }}
          SUPPORT: ${{ github.event.inputs.support }}
          TARGET: ${{ github.event.inputs.target }}
          GENERATE_IF_MISSING: ${{ github.event.inputs.generate_if_missing }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const root = "/tmp/youtube-thumbnail-source";
          const setId = process.env.SET_ID;
          const support = String(process.env.SUPPORT || "").trim().replace(/_/g, "-").toUpperCase();
          const target = String(process.env.TARGET || "").trim().replace(/_/g, "-").toUpperCase();
          const matches = [];
          function walk(dir) {
            for (const ent of fs.readdirSync(dir, { withFileTypes: true })) {
              const p = path.join(dir, ent.name);
              if (ent.isDirectory()) walk(p);
              else if (ent.name === "youtube_metadata.json") {
                const metadata = JSON.parse(fs.readFileSync(p, "utf8"));
                const mSet = String(metadata.setId || "");
                const mSupport = String(metadata.supportLang || "").replace(/_/g, "-").toUpperCase();
                const mTarget = String(metadata.targetLang || "").replace(/_/g, "-").toUpperCase();
                if (mSet === setId && mSupport === support && mTarget === target) matches.push(p);
              }
            }
          }
          walk(root);
          if (matches.length !== 1) {
            console.error(`Expected exactly one metadata match, got ${matches.length}`);
            for (const item of matches) console.error(item);
            process.exit(1);
          }
          const metadataPath = matches[0];
          const thumbnailPath = path.join(path.dirname(metadataPath), "youtube_thumbnail.jpg");
          const thumbnailExists = fs.existsSync(thumbnailPath);
          const generateIfMissing = String(process.env.GENERATE_IF_MISSING || "") === "true";
          if (!thumbnailExists && !generateIfMissing) {
            console.error(`Missing thumbnail next to metadata: ${thumbnailPath}`);
            console.error("Set generate_if_missing=true and confirm_thumbnail_spend=GENERATE_THUMBNAILS to generate it on GitHub.");
            process.exit(1);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `metadata=${metadataPath}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `thumbnail=${thumbnailPath}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `needs_generation=${thumbnailExists ? "false" : "true"}\n`);
          console.log(JSON.stringify({ metadataPath, thumbnailPath, thumbnailExists, needsGeneration: !thumbnailExists }, null, 2));
          NODE

      - name: Locate metadata for repo-thumbnail mode
        id: locate_repo
        if: github.event.inputs.use_repo_thumbnail == 'true'
        shell: bash
        env:
          SET_ID: ${{ github.event.inputs.set_id }}
          SUPPORT: ${{ github.event.inputs.support }}
          TARGET: ${{ github.event.inputs.target }}
          REPO_THUMBNAIL: ${{ steps.repo_thumbnail.outputs.thumbnail }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const setId   = String(process.env.SET_ID   || "").trim();
          const support = String(process.env.SUPPORT  || "").trim().toUpperCase();
          const target  = String(process.env.TARGET   || "").trim().toUpperCase();
          const repoThumb = String(process.env.REPO_THUMBNAIL || "").trim();

          // Locate youtube_metadata.json in outputs/video-generator/ or by-support/
          let metadataPath = null;
          const candidates = [
            `outputs/video-generator/${setId}_${support.toLowerCase()}_${target.toLowerCase()}/youtube_metadata.json`,
            `outputs/video-generator/${setId}_ordinary_${support.toLowerCase()}_${target.toLowerCase()}/youtube_metadata.json`,
          ];
          for (const c of candidates) {
            if (fs.existsSync(c)) { metadataPath = c; break; }
          }
          // If not found in video-generator, use the sidecar video.json from by-support as a proxy
          if (!metadataPath) {
            const bases = [
              `outputs/design-prototypes/youtube-thumbnail-${setId}-ordinary-target-language-large-pair-folders-20260704/by-support`,
            ];
            for (const base of bases) {
              if (!fs.existsSync(base)) continue;
              const supportDirs = fs.readdirSync(base).filter(d => d.startsWith(support + "__"));
              for (const sd of supportDirs) {
                const pairBase = path.join(base, sd);
                const pairDirs = fs.readdirSync(pairBase).filter(d => {
                  const parts = d.split("__");
                  return parts[0] === support && parts[1] === target;
                });
                for (const pd of pairDirs) {
                  const sidecar = path.join(pairBase, pd, "video.json");
                  if (fs.existsSync(sidecar)) { metadataPath = sidecar; break; }
                }
                if (metadataPath) break;
              }
              if (metadataPath) break;
            }
          }

          if (!metadataPath) {
            console.error(`Could not locate youtube_metadata.json or video.json for ${support}→${target}`);
            process.exit(1);
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `metadata=${metadataPath}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `thumbnail=${repoThumb}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `needs_generation=false\n`);
          console.log(JSON.stringify({ metadataPath, thumbnail: repoThumb }, null, 2));
          NODE

      - name: Generate missing thumbnail
        if: steps.locate.outputs.needs_generation == 'true'
        shell: bash
        env:
          CONFIRM_THUMBNAIL_SPEND: ${{ github.event.inputs.confirm_thumbnail_spend }}
          METADATA: ${{ steps.locate.outputs.metadata }}
          VECTORENGINE_API_KEY: ${{ secrets.VECTORENGINE_API_KEY }}
          VECTOR_ENGINE_API_KEY: ${{ secrets.VECTOR_ENGINE_API_KEY }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM_THUMBNAIL_SPEND" != "GENERATE_THUMBNAILS" ]; then
            echo "::error::Thumbnail generation spends VectorEngine image credits. Set confirm_thumbnail_spend=GENERATE_THUMBNAILS."
            exit 1
          fi
          if [ -z "${VECTORENGINE_API_KEY:-}" ] && [ -z "${VECTOR_ENGINE_API_KEY:-}" ]; then
            echo "::error::Missing VECTORENGINE_API_KEY / VECTOR_ENGINE_API_KEY for thumbnail generation."
            exit 1
          fi
          npm run generate:youtube-thumbnails -- "$METADATA" --confirm-spend --concurrency=1 --output=outputs/youtube-thumbnail-generation-report-github.json
          test -f "${{ steps.locate.outputs.thumbnail }}"

      - name: Dry-run thumbnail update plan
        shell: bash
        env:
          VIDEO_ID: ${{ github.event.inputs.video_id }}
          SUPPORT: ${{ github.event.inputs.support }}
          TARGET: ${{ github.event.inputs.target }}
          SET_ID: ${{ github.event.inputs.set_id }}
          METADATA: ${{ github.event.inputs.use_repo_thumbnail == 'true' && steps.locate_repo.outputs.metadata || steps.locate.outputs.metadata }}
          THUMBNAIL: ${{ github.event.inputs.use_repo_thumbnail == 'true' && steps.locate_repo.outputs.thumbnail || steps.locate.outputs.thumbnail }}
        run: |
          set -euo pipefail
          node scripts/youtube-set-video-thumbnail.mjs \
            --video-id="$VIDEO_ID" \
            --metadata="$METADATA" \
            --thumbnail="$THUMBNAIL" \
            --support="$SUPPORT" \
            --target="$TARGET" \
            --set-id="$SET_ID"

      - name: Set YouTube thumbnail
        shell: bash
        env:
          VIDEO_ID: ${{ github.event.inputs.video_id }}
          SUPPORT: ${{ github.event.inputs.support }}
          TARGET: ${{ github.event.inputs.target }}
          SET_ID: ${{ github.event.inputs.set_id }}
          METADATA: ${{ github.event.inputs.use_repo_thumbnail == 'true' && steps.locate_repo.outputs.metadata || steps.locate.outputs.metadata }}
          THUMBNAIL: ${{ github.event.inputs.use_repo_thumbnail == 'true' && steps.locate_repo.outputs.thumbnail || steps.locate.outputs.thumbnail }}
        run: |
          set -euo pipefail
          node scripts/youtube-set-video-thumbnail.mjs \
            --video-id="$VIDEO_ID" \
            --metadata="$METADATA" \
            --thumbnail="$THUMBNAIL" \
            --support="$SUPPORT" \
            --target="$TARGET" \
            --set-id="$SET_ID" \
            --apply \
            --confirm-youtube-write

      - name: Upload thumbnail-set evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-thumbnail-set-${{ github.event.inputs.video_id }}
          path: |
            ${{ github.event.inputs.use_repo_thumbnail == 'true' && steps.locate_repo.outputs.metadata || steps.locate.outputs.metadata }}
            ${{ github.event.inputs.use_repo_thumbnail == 'true' && steps.locate_repo.outputs.thumbnail || steps.locate.outputs.thumbnail }}
            outputs/youtube-thumbnail-generation-report-github.json
            outputs/youtube-thumbnail-ledger.jsonl
            config/youtube-channels.json
            config/youtube-published-videos.json
          if-no-files-found: ignore
