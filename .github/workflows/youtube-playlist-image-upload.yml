name: YouTube Playlist Image Upload

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "plan is read-only; apply writes playlist images to YouTube."
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply
      route:
        description: "YouTube API project route for this run."
        required: true
        default: "youtube-1"
        type: choice
        options:
          - youtube-1
          - youtube-2
          - youtube-3
          - youtube-4
      youtube_environment:
        description: "GitHub environment with this route's OAuth bundle. Use auto for route default."
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - youtube-api-branding
          - youtube-api-youtube-2
          - youtube-api-youtube-3
          - youtube-api-youtube-4
      supports:
        description: "Comma-separated channel keys/supports in one route, e.g. en,es,pt."
        required: true
        default: "en"
      manifest_path:
        description: "Tracked playlist image manifest path."
        required: true
        default: "data/youtube-playlist-covers/20260709-routes-1-2-3-five-per-channel/manifest.json"
      limit_per_channel:
        description: "Maximum playlist images per channel."
        required: true
        default: "5"
      skip_uploaded:
        description: "Skip registry rows that already have playlistImage.status=uploaded."
        required: true
        default: true
        type: boolean
      confirm_youtube_write:
        description: "For mode=apply type APPLY_YOUTUBE_PLAYLIST_IMAGES."
        required: false
        default: ""

permissions:
  contents: write
  actions: read

concurrency:
  group: youtube-playlist-image-upload-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  playlist-image-upload:
    runs-on: ubuntu-latest
    environment:
      name: >-
        ${{
          github.event.inputs.youtube_environment != 'auto' && github.event.inputs.youtube_environment ||
          (github.event.inputs.route == 'youtube-1' && 'youtube-api-branding') ||
          (github.event.inputs.route == 'youtube-2' && 'youtube-api-youtube-2') ||
          (github.event.inputs.route == 'youtube-3' && 'youtube-api-youtube-3') ||
          (github.event.inputs.route == 'youtube-4' && 'youtube-api-youtube-4') ||
          'youtube-api-branding'
        }}
    timeout-minutes: 90
    env:
      EFFECTIVE_YOUTUBE_ENVIRONMENT: >-
        ${{
          github.event.inputs.youtube_environment != 'auto' && github.event.inputs.youtube_environment ||
          (github.event.inputs.route == 'youtube-1' && 'youtube-api-branding') ||
          (github.event.inputs.route == 'youtube-2' && 'youtube-api-youtube-2') ||
          (github.event.inputs.route == 'youtube-3' && 'youtube-api-youtube-3') ||
          (github.event.inputs.route == 'youtube-4' && 'youtube-api-youtube-4') ||
          'youtube-api-branding'
        }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Refuse unsafe inputs
        shell: bash
        env:
          MODE: ${{ github.event.inputs.mode }}
          ROUTE: ${{ github.event.inputs.route }}
          YOUTUBE_ENVIRONMENT: ${{ github.event.inputs.youtube_environment }}
          SUPPORTS: ${{ github.event.inputs.supports }}
          MANIFEST_PATH: ${{ github.event.inputs.manifest_path }}
          LIMIT_PER_CHANNEL: ${{ github.event.inputs.limit_per_channel }}
          CONFIRM_YOUTUBE_WRITE: ${{ github.event.inputs.confirm_youtube_write }}
        run: |
          set -euo pipefail
          case "$ROUTE" in
            youtube-1) EXPECTED_ENV="youtube-api-branding" ;;
            youtube-2) EXPECTED_ENV="youtube-api-youtube-2" ;;
            youtube-3) EXPECTED_ENV="youtube-api-youtube-3" ;;
            youtube-4) EXPECTED_ENV="youtube-api-youtube-4" ;;
            *) echo "::error::Unsupported route: $ROUTE"; exit 1 ;;
          esac
          if [ "$YOUTUBE_ENVIRONMENT" != "auto" ] && [ "$YOUTUBE_ENVIRONMENT" != "$EXPECTED_ENV" ]; then
            echo "::error::Route $ROUTE must use $EXPECTED_ENV, got $YOUTUBE_ENVIRONMENT"
            exit 1
          fi
          if [ "$EFFECTIVE_YOUTUBE_ENVIRONMENT" != "$EXPECTED_ENV" ]; then
            echo "::error::Effective environment mismatch for $ROUTE: expected $EXPECTED_ENV got $EFFECTIVE_YOUTUBE_ENVIRONMENT"
            exit 1
          fi
          if [ ! -f "$MANIFEST_PATH" ]; then
            echo "::error::Missing manifest_path: $MANIFEST_PATH"
            exit 1
          fi
          if ! printf '%s' "$LIMIT_PER_CHANNEL" | grep -Eq '^[0-9]+$'; then
            echo "::error::limit_per_channel must be an integer"
            exit 1
          fi
          if [ "$LIMIT_PER_CHANNEL" -lt 1 ] || [ "$LIMIT_PER_CHANNEL" -gt 50 ]; then
            echo "::error::limit_per_channel must be between 1 and 50"
            exit 1
          fi
          if [ "$MODE" = "apply" ] && [ "$CONFIRM_YOUTUBE_WRITE" != "APPLY_YOUTUBE_PLAYLIST_IMAGES" ]; then
            echo "::error::mode=apply requires confirm_youtube_write=APPLY_YOUTUBE_PLAYLIST_IMAGES"
            exit 1
          fi

      - name: Validate route environment
        shell: bash
        env:
          SUPPORTS: ${{ github.event.inputs.supports }}
        run: node scripts/resolve-youtube-api-environment.mjs --support="$SUPPORTS" --environment="$EFFECTIVE_YOUTUBE_ENVIRONMENT"

      - name: Restore YouTube OAuth bundle from secret
        if: ${{ github.event.inputs.mode == 'apply' }}
        env:
          YOUTUBE_OAUTH_BUNDLE_TGZ_B64: ${{ secrets.YOUTUBE_OAUTH_BUNDLE_TGZ_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${YOUTUBE_OAUTH_BUNDLE_TGZ_B64:-}" ]; then
            echo "::error::Missing environment secret YOUTUBE_OAUTH_BUNDLE_TGZ_B64"
            exit 1
          fi
          printf '%s' "$YOUTUBE_OAUTH_BUNDLE_TGZ_B64" | base64 -d | tar -xzf -
          test -f .local/youtube-oauth/google-oauth-client.json
          test -d .local/youtube-oauth/tokens
          echo "YouTube OAuth bundle restored for this runner."

      - name: Upload playlist images
        shell: bash
        env:
          MODE: ${{ github.event.inputs.mode }}
          SUPPORTS: ${{ github.event.inputs.supports }}
          MANIFEST_PATH: ${{ github.event.inputs.manifest_path }}
          LIMIT_PER_CHANNEL: ${{ github.event.inputs.limit_per_channel }}
          SKIP_UPLOADED: ${{ github.event.inputs.skip_uploaded }}
          ROUTE: ${{ github.event.inputs.route }}
        run: |
          set -euo pipefail
          ARGS=(
            "--manifest=$MANIFEST_PATH"
            "--supports=$SUPPORTS"
            "--limit-per-channel=$LIMIT_PER_CHANNEL"
            "--output-dir=outputs/youtube-playlist-image-upload-github/$ROUTE"
          )
          if [ "$SKIP_UPLOADED" = "true" ]; then
            ARGS+=("--skip-uploaded")
          fi
          if [ "$MODE" = "apply" ]; then
            ARGS+=("--apply" "--confirm-youtube-write")
          fi
          node scripts/youtube-upload-playlist-images.mjs "${ARGS[@]}"

      - name: Commit playlist image state
        if: ${{ github.event.inputs.mode == 'apply' }}
        shell: bash
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          ROUTE: ${{ github.event.inputs.route }}
        run: |
          set -euo pipefail
          if git diff --quiet -- config/youtube-playlists.json; then
            echo "No playlist image state changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/youtube-playlists.json
          git commit -m "Persist YouTube playlist image upload for ${ROUTE}" \
            -m "Source workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          git push origin "HEAD:$BRANCH_NAME"

      - name: Upload playlist image report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: youtube-playlist-image-upload-${{ github.event.inputs.route }}-${{ github.event.inputs.mode }}-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            outputs/youtube-playlist-image-upload-github/**
            config/youtube-playlists.json
