name: YouTube Campaign Route Publish

on:
  workflow_call:
    inputs:
      video_type: { required: false, type: string, default: "combined" }
      route_key: { required: true, type: string }
      campaign_id: { required: true, type: string }
      campaign_manifest_hash: { required: true, type: string }
      set_id: { required: true, type: string }
      offline_deck_git_commit: { required: false, type: string, default: "" }
      offline_deck_git_blob: { required: false, type: string, default: "" }
      offline_deck_sha256: { required: false, type: string, default: "" }
      video_cache_resume_run_id: { required: false, type: string, default: "" }
      video_cache_resume_support: { required: false, type: string, default: "" }
      confirm_vectorengine_metadata: { required: false, type: string, default: "" }
      playlist_preflight_mode: { required: false, type: string, default: "owned_complete" }
      confirm_target_playlist_only: { required: false, type: string, default: "" }

permissions:
  actions: read
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      ordinary_worker_count: ${{ steps.route_matrix.outputs.ordinary_worker_count }}
      ordinary_worker_matrix: ${{ steps.route_matrix.outputs.ordinary_worker_matrix }}
      polyglot_worker_count: ${{ steps.route_matrix.outputs.polyglot_worker_count }}
      polyglot_worker_matrix: ${{ steps.route_matrix.outputs.polyglot_worker_matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci || npm install
      - name: Validate the claimed campaign and select one project queue
        id: route_matrix
        shell: bash
        env:
          CAMPAIGN_ID: ${{ inputs.campaign_id }}
          MANIFEST_HASH: ${{ inputs.campaign_manifest_hash }}
          ROUTE_KEY: ${{ inputs.route_key }}
          VIDEO_TYPE: ${{ inputs.video_type }}
        run: |
          set -euo pipefail
          npm run prepare:youtube-publication-campaign-run -- \
            --campaign-id="$CAMPAIGN_ID" \
            --manifest-hash="$MANIFEST_HASH" \
            --output=outputs/youtube-publication-campaign-route-preflight.json
          node <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync("outputs/youtube-publication-campaign-route-preflight.json", "utf8"));
          const route = process.env.ROUTE_KEY;
          const type = process.env.VIDEO_TYPE;
          if (!["ordinary", "polyglot", "combined"].includes(type)) throw new Error(`unsupported video_type: ${type}`);
          const select = (source, enabled) => enabled ? source.filter((row) => row.route_key === route) : [];
          const ordinary = select(report.ordinaryMatrix, type !== "polyglot");
          const polyglot = select(report.polyglotMatrix, type !== "ordinary");
          for (const [phase, include] of [["ordinary", ordinary], ["polyglot", polyglot]]) {
            if (include.some((row) => !row.support || !row.route_key)) throw new Error(`${route}: invalid ${phase} worker matrix row`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `${phase}_worker_count=${include.length}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `${phase}_worker_matrix=${JSON.stringify({ include })}\n`);
          }
          NODE

  ordinary:
    if: ${{ (inputs.video_type == 'ordinary' || inputs.video_type == 'combined') && needs.prepare.outputs.ordinary_worker_count != '0' }}
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJSON(needs.prepare.outputs.ordinary_worker_matrix) }}
    uses: ./.github/workflows/youtube-video-publish.yml
    with:
      mode: apply
      set_id: ${{ inputs.set_id }}
      support: ${{ matrix.support }}
      youtube_environment: ${{ matrix.youtube_environment }}
      langs: ${{ matrix.langs }}
      concurrency: "3"
      metadata_gemini_backend: api,vectorengine
      metadata_batch_size: "5"
      metadata_rate_limit_ms: "15000"
      worker_count: "1"
      worker_index: "0"
      privacy: private
      publish_mode: scheduled
      schedule_start_date: ${{ matrix.schedule_start_date }}
      schedule_min_future_minutes: "90"
      create_playlists: true
      allow_republish: false
      generate_thumbnails: false
      confirm_vectorengine_metadata: ${{ inputs.confirm_vectorengine_metadata }}
      confirm_youtube_write: APPLY_YOUTUBE_UPLOAD
      confirm_public: PUBLISH_PUBLIC
      campaign_id: ${{ inputs.campaign_id }}
      campaign_manifest_hash: ${{ inputs.campaign_manifest_hash }}
      campaign_metadata_route: ${{ inputs.route_key }}
      campaign_owned_apply: true
      offline_deck_git_commit: ${{ inputs.offline_deck_git_commit }}
      offline_deck_git_blob: ${{ inputs.offline_deck_git_blob }}
      offline_deck_sha256: ${{ inputs.offline_deck_sha256 }}
      source_cache_run_id: ${{ matrix.support == inputs.video_cache_resume_support && inputs.video_cache_resume_run_id || '' }}
    secrets: inherit

  polyglot:
    # This route does not wait for ordinary work in the other seven projects.
    # A failed ordinary worker in this route still must not suppress its
    # independent Polyglot tail; exact receipts drive final recovery.
    if: ${{ always() && !cancelled() && needs.prepare.result == 'success' && (inputs.video_type == 'polyglot' || inputs.video_type == 'combined') && needs.prepare.outputs.polyglot_worker_count != '0' }}
    needs: [prepare, ordinary]
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJSON(needs.prepare.outputs.polyglot_worker_matrix) }}
    uses: ./.github/workflows/youtube-polyglot-video-publish.yml
    with:
      mode: apply
      set_id: ${{ inputs.set_id }}
      support: ${{ matrix.support }}
      bundle: ""
      campaign_polyglot_rows: ${{ matrix.polyglot_rows }}
      privacy: private
      publish_mode: scheduled
      publish_at: ""
      schedule_start_date: ${{ matrix.schedule_start_date }}
      schedule_min_future_minutes: "90"
      create_playlists: ${{ inputs.playlist_preflight_mode != 'target_playlist_only' }}
      allow_republish: false
      generate_thumbnails: false
      confirm_render: RENDER_POLYGLOT_VIDEO
      confirm_tts: GENERATE_TTS_AUDIO
      confirm_metadata_spend: GENERATE_POLYGLOT_METADATA
      confirm_vectorengine_metadata: ${{ inputs.confirm_vectorengine_metadata }}
      playlist_preflight_mode: ${{ inputs.playlist_preflight_mode }}
      confirm_target_playlist_only: ${{ inputs.confirm_target_playlist_only }}
      confirm_youtube_write: APPLY_POLYGLOT_YOUTUBE_UPLOAD
      confirm_public: PUBLISH_PUBLIC
      campaign_id: ${{ inputs.campaign_id }}
      campaign_manifest_hash: ${{ inputs.campaign_manifest_hash }}
      campaign_metadata_route: ${{ inputs.route_key }}
      campaign_owned_apply: true
      offline_deck_git_commit: ${{ inputs.offline_deck_git_commit }}
      offline_deck_git_blob: ${{ inputs.offline_deck_git_blob }}
      offline_deck_sha256: ${{ inputs.offline_deck_sha256 }}
    secrets: inherit
