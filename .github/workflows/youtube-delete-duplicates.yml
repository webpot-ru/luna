name: YouTube Delete Duplicate Videos

on:
  workflow_dispatch:
    inputs:
      route:
        description: "Historical exact deletion plan route: youtube-1 through youtube-4."
        required: true
        default: "youtube-2"
      youtube_environment:
        description: "GitHub environment with the OAuth bundle. Must match the route environment."
        required: true
        default: "youtube-api-youtube-2"
        type: choice
        options:
          - youtube-api-branding
          - youtube-api-youtube-2
          - youtube-api-youtube-3
          - youtube-api-youtube-4
      confirm_youtube_write:
        description: "Type APPLY_YOUTUBE_DELETE to confirm live deletions."
        required: true
        default: ""

permissions:
  contents: write

jobs:
  delete-duplicates:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.youtube_environment }}
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Restore YouTube OAuth bundle from environment secret
        env:
          YOUTUBE_OAUTH_BUNDLE_TGZ_B64: ${{ secrets.YOUTUBE_OAUTH_BUNDLE_TGZ_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${YOUTUBE_OAUTH_BUNDLE_TGZ_B64:-}" ]; then
            echo "::error::Missing environment secret YOUTUBE_OAUTH_BUNDLE_TGZ_B64"
            exit 1
          fi
          printf '%s' "$YOUTUBE_OAUTH_BUNDLE_TGZ_B64" | base64 -d | tar -xzf -
          test -f .local/youtube-oauth/google-oauth-client.json
          test -d .local/youtube-oauth/tokens

      - name: Run deletion script (Dry-run or Live)
        shell: bash
        env:
          ROUTE: ${{ github.event.inputs.route }}
          TARGET_FILE: config/youtube-duplicate-delete-plans/2026-07-13-decks-1-2-32.json
          CONFIRM_WRITE: ${{ github.event.inputs.confirm_youtube_write }}
        run: |
          set -euo pipefail
          ARGS=("--route=$ROUTE" "--target-file=$TARGET_FILE" "--report-file=outputs/youtube-duplicate-deletion-report-$ROUTE.json")
          if [ "$CONFIRM_WRITE" = "APPLY_YOUTUBE_DELETE" ]; then
            ARGS+=("--apply" "--confirm-youtube-write")
            echo "Confirming live YouTube deletions..."
          else
            echo "Running in DRY-RUN mode..."
          fi
          node scripts/youtube-delete-duplicate-videos.mjs "${ARGS[@]}"

      - name: Upload exact deletion evidence and durable-state candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-duplicate-deletion-${{ github.event.inputs.route }}-${{ github.run_id }}
          if-no-files-found: error
          path: |
            outputs/youtube-duplicate-deletion-report-${{ github.event.inputs.route }}.json
            config/youtube-published-videos.json
            config/youtube-publish-calendar.json
