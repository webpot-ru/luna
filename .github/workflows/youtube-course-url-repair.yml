name: YouTube Course URL Repair

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "plan is local registry only; audit reads live snippets; apply updates YouTube descriptions."
        required: true
        default: "audit"
        type: choice
        options:
          - plan
          - audit
          - apply
      set_id:
        description: "Set ID to repair."
        required: true
        default: "home_kitchen_cookware_pilot_01"
      target:
        description: "Target language code. Current supported repair is NB -> public langs=no."
        required: true
        default: "NB"
      route:
        description: "YouTube API project route to audit/repair in this batch."
        required: true
        default: "youtube-1"
        type: choice
        options:
          - youtube-1
          - youtube-2
          - youtube-3
          - youtube-4
          - youtube-5
          - youtube-6
          - youtube-7
          - youtube-8
      youtube_environment:
        description: "GitHub environment with this route's OAuth bundle. Use auto for route default."
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - youtube-api-branding
          - youtube-api-youtube-2
          - youtube-api-youtube-3
          - youtube-api-youtube-4
          - youtube-api-youtube-5
          - youtube-api-youtube-6
          - youtube-api-youtube-7
          - youtube-api-youtube-8
      supports:
        description: "Optional support language codes to limit repair, comma-separated."
        required: false
        default: ""
      video_ids:
        description: "Optional YouTube video ids to limit repair, comma-separated."
        required: false
        default: ""
      max_updates:
        description: "Maximum videos.update calls in apply mode."
        required: true
        default: "20"
      confirm_youtube_write:
        description: "For mode=apply type APPLY_YOUTUBE_COURSE_URL_UPDATE."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: youtube-course-url-repair-${{ github.event.inputs.route }}-${{ github.event.inputs.mode }}
  cancel-in-progress: false

jobs:
  youtube-course-url-repair:
    runs-on: ubuntu-latest
    environment:
      name: >-
        ${{
          github.event.inputs.youtube_environment != 'auto' && github.event.inputs.youtube_environment ||
          (github.event.inputs.route == 'youtube-1' && 'youtube-api-branding') ||
          (github.event.inputs.route == 'youtube-2' && 'youtube-api-youtube-2') ||
          (github.event.inputs.route == 'youtube-3' && 'youtube-api-youtube-3') ||
          (github.event.inputs.route == 'youtube-4' && 'youtube-api-youtube-4') ||
          (github.event.inputs.route == 'youtube-5' && 'youtube-api-youtube-5') ||
          (github.event.inputs.route == 'youtube-6' && 'youtube-api-youtube-6') ||
          (github.event.inputs.route == 'youtube-7' && 'youtube-api-youtube-7') ||
          (github.event.inputs.route == 'youtube-8' && 'youtube-api-youtube-8') ||
          'youtube-api-branding'
        }}
    timeout-minutes: 120
    env:
      EFFECTIVE_YOUTUBE_ENVIRONMENT: >-
        ${{
          github.event.inputs.youtube_environment != 'auto' && github.event.inputs.youtube_environment ||
          (github.event.inputs.route == 'youtube-1' && 'youtube-api-branding') ||
          (github.event.inputs.route == 'youtube-2' && 'youtube-api-youtube-2') ||
          (github.event.inputs.route == 'youtube-3' && 'youtube-api-youtube-3') ||
          (github.event.inputs.route == 'youtube-4' && 'youtube-api-youtube-4') ||
          (github.event.inputs.route == 'youtube-5' && 'youtube-api-youtube-5') ||
          (github.event.inputs.route == 'youtube-6' && 'youtube-api-youtube-6') ||
          (github.event.inputs.route == 'youtube-7' && 'youtube-api-youtube-7') ||
          (github.event.inputs.route == 'youtube-8' && 'youtube-api-youtube-8') ||
          'youtube-api-branding'
        }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Refuse unsafe course URL repair inputs
        shell: bash
        env:
          MODE: ${{ github.event.inputs.mode }}
          TARGET: ${{ github.event.inputs.target }}
          ROUTE: ${{ github.event.inputs.route }}
          YOUTUBE_ENVIRONMENT: ${{ github.event.inputs.youtube_environment }}
          MAX_UPDATES: ${{ github.event.inputs.max_updates }}
          CONFIRM_YOUTUBE_WRITE: ${{ github.event.inputs.confirm_youtube_write }}
        run: |
          set -euo pipefail
          case "$ROUTE" in
            youtube-1) EXPECTED_ENV="youtube-api-branding" ;;
            youtube-2) EXPECTED_ENV="youtube-api-youtube-2" ;;
            youtube-3) EXPECTED_ENV="youtube-api-youtube-3" ;;
            youtube-4) EXPECTED_ENV="youtube-api-youtube-4" ;;
            youtube-5) EXPECTED_ENV="youtube-api-youtube-5" ;;
            youtube-6) EXPECTED_ENV="youtube-api-youtube-6" ;;
            youtube-7) EXPECTED_ENV="youtube-api-youtube-7" ;;
            youtube-8) EXPECTED_ENV="youtube-api-youtube-8" ;;
            *) echo "::error::Unsupported route: $ROUTE"; exit 1 ;;
          esac
          if [ "$YOUTUBE_ENVIRONMENT" != "auto" ] && [ "$YOUTUBE_ENVIRONMENT" != "$EXPECTED_ENV" ]; then
            echo "::error::Route $ROUTE must use $EXPECTED_ENV, got $YOUTUBE_ENVIRONMENT"
            exit 1
          fi
          if [ "$EFFECTIVE_YOUTUBE_ENVIRONMENT" != "$EXPECTED_ENV" ]; then
            echo "::error::Effective environment mismatch for $ROUTE: expected $EXPECTED_ENV got $EFFECTIVE_YOUTUBE_ENVIRONMENT"
            exit 1
          fi
          if [ "$TARGET" != "NB" ]; then
            echo "::error::This workflow currently allows only target=NB for the documented Norwegian/Bokmal public URL alias."
            exit 1
          fi
          if ! printf '%s' "$MAX_UPDATES" | grep -Eq '^[0-9]+$'; then
            echo "::error::max_updates must be an integer."
            exit 1
          fi
          if [ "$MAX_UPDATES" -lt 1 ] || [ "$MAX_UPDATES" -gt 50 ]; then
            echo "::error::max_updates must be between 1 and 50."
            exit 1
          fi
          if [ "$MODE" = "apply" ] && [ "$CONFIRM_YOUTUBE_WRITE" != "APPLY_YOUTUBE_COURSE_URL_UPDATE" ]; then
            echo "::error::mode=apply requires confirm_youtube_write=APPLY_YOUTUBE_COURSE_URL_UPDATE"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Restore YouTube OAuth bundle from environment secret
        if: ${{ github.event.inputs.mode == 'audit' || github.event.inputs.mode == 'apply' }}
        env:
          YOUTUBE_OAUTH_BUNDLE_TGZ_B64: ${{ secrets.YOUTUBE_OAUTH_BUNDLE_TGZ_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${YOUTUBE_OAUTH_BUNDLE_TGZ_B64:-}" ]; then
            echo "::error::Missing environment secret YOUTUBE_OAUTH_BUNDLE_TGZ_B64"
            exit 1
          fi
          printf '%s' "$YOUTUBE_OAUTH_BUNDLE_TGZ_B64" | base64 -d | tar -xzf -
          test -f .local/youtube-oauth/google-oauth-client.json
          test -d .local/youtube-oauth/tokens
          echo "YouTube OAuth bundle restored for environment $EFFECTIVE_YOUTUBE_ENVIRONMENT."

      - name: Audit or repair course URLs
        shell: bash
        env:
          MODE: ${{ github.event.inputs.mode }}
          SET_ID: ${{ github.event.inputs.set_id }}
          TARGET: ${{ github.event.inputs.target }}
          ROUTE: ${{ github.event.inputs.route }}
          SUPPORTS: ${{ github.event.inputs.supports }}
          VIDEO_IDS: ${{ github.event.inputs.video_ids }}
          MAX_UPDATES: ${{ github.event.inputs.max_updates }}
        run: |
          set -euo pipefail
          ARGS=("--set=$SET_ID" "--target=$TARGET" "--route=$ROUTE" "--max-updates=$MAX_UPDATES" "--output-dir=outputs/youtube-course-url-repair")
          if [ -n "$(printf '%s' "$SUPPORTS" | xargs)" ]; then
            ARGS+=("--supports=$SUPPORTS")
          fi
          if [ -n "$(printf '%s' "$VIDEO_IDS" | xargs)" ]; then
            ARGS+=("--video-ids=$VIDEO_IDS")
          fi
          if [ "$MODE" = "audit" ]; then
            ARGS+=("--live-audit")
          fi
          if [ "$MODE" = "apply" ]; then
            ARGS+=("--apply" "--confirm-youtube-write")
          fi
          npm run repair:youtube-course-url -- "${ARGS[@]}"

      - name: Upload non-secret course URL repair artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: youtube-course-url-repair-${{ github.event.inputs.route }}-${{ github.event.inputs.mode }}-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            outputs/youtube-course-url-repair/**
            config/youtube-published-videos.json

  persist-course-url-repair-state:
    needs: youtube-course-url-repair
    if: ${{ always() && github.event.inputs.mode == 'apply' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: youtube-course-url-repair-state-${{ github.ref_name }}-${{ github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Download course URL repair state artifact
        id: download_course_url_repair_state
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: youtube-course-url-repair-${{ github.event.inputs.route }}-${{ github.event.inputs.mode }}-${{ github.run_id }}
          path: .state-artifact

      - name: Merge course URL repair state into current branch
        shell: bash
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ ! -f .state-artifact/config/youtube-published-videos.json ]; then
            echo "No course URL repair state artifact found; nothing to persist."
            exit 0
          fi
          git fetch origin "$BRANCH_NAME"
          git checkout "$BRANCH_NAME"
          git pull --ff-only origin "$BRANCH_NAME"
          node scripts/merge-youtube-course-url-repair-state.mjs --artifact-dir=.state-artifact --summary=outputs/youtube-course-url-repair-state-merge-github.json
          cat outputs/youtube-course-url-repair-state-merge-github.json

      - name: Commit and push course URL repair state
        shell: bash
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          ROUTE: ${{ github.event.inputs.route }}
        run: |
          set -euo pipefail
          if git diff --quiet -- config/youtube-published-videos.json; then
            echo "No YouTube course URL repair state changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/youtube-published-videos.json
          git commit -m "Persist YouTube course URL repair for ${ROUTE}" \
            -m "Source workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          git push origin "HEAD:$BRANCH_NAME"

      - name: Upload course URL repair state merge summary
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: youtube-course-url-repair-state-merge-${{ github.event.inputs.route }}-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: ignore
          path: outputs/youtube-course-url-repair-state-merge-github.json
